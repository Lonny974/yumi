<title>Yumi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Direction « Moderne & Épuré » : neutres froids, bleu en accent, violet pour les favoris. Grille de photos sur iPhone, deux colonnes sur iPad. */
:root {
  --bg: #f9fafb;
  --surface: #ffffff;
  --ink: #111827;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #3b82f6;
  --accent-soft: #eaf2fe;
  --on-accent: #ffffff;
  --gold: #8b5cf6;
  --danger: #dc2626;
  --shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 8px 24px rgba(17, 24, 39, .06);
  --font-display: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --surface: #111827; --ink: #f9fafb; --muted: #9ca3af; --line: #1f2937;
    --accent: #60a5fa; --accent-soft: #172554; --on-accent: #0b1120; --gold: #a78bfa; --danger: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #111827; --ink: #f9fafb; --muted: #9ca3af; --line: #1f2937;
  --accent: #60a5fa; --accent-soft: #172554; --on-accent: #0b1120; --gold: #a78bfa; --danger: #f87171;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
h1 { font-weight: 800; }

.shell { display: flex; flex-direction: column; height: 100%; }
.views { flex: 1; min-height: 0; position: relative; }
.view { height: 100%; }
.app { display: grid; grid-template-columns: 1fr; height: 100%; }
body:not(.v-recettes) .app, body:not(.v-semaine) #planView, body:not(.v-courses) #shopView { display: none; }
.tabbar {
  display: flex; justify-content: center; gap: 4px; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.tab {
  flex: 1; max-width: 180px; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: .75rem; font-weight: 600; padding: 4px 0; border-radius: 10px;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab .badge { position: absolute; }
.scroll { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.page { max-width: 1100px; margin: 0 auto; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.page-head h1 { font-size: 1.75rem; flex: 1; min-width: 180px; }
.weeknav { display: flex; align-items: center; gap: 6px; }
.weeknav b { min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; font-size: .95rem; }
.days { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 700px) { .days { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .days { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.day.today { border-color: var(--accent); }
.day-h { display: flex; align-items: baseline; gap: 8px; }
.day-h h3 { font-size: 1.1rem; }
.day-h small { color: var(--muted); font-variant-numeric: tabular-nums; }
.day-h .now { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-left: auto; }
.slot { display: flex; flex-direction: column; gap: 6px; }
.slot-h { display: flex; align-items: center; justify-content: space-between; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.slot-h button { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: .8rem; letter-spacing: 0; text-transform: none; padding: 4px 2px; }
.meal { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.meal .name { flex: 1; min-width: 0; font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; text-align: left; padding: 0; }
.mini { display: inline-flex; align-items: center; gap: 4px; font-size: .82rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.mini button, .rm { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 700; line-height: 1; display: grid; place-items: center; padding: 0; }
.rm { color: var(--muted); border-color: transparent; background: none; font-size: 1.1rem; }
.slot-empty { font-size: .85rem; color: var(--muted); }
.summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: .9rem; }
.btn.accent { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.picker { display: flex; flex-direction: column; gap: 6px; padding-block: 12px 24px; }
.pick { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 10px; }
.pick .thumb { width: 44px; height: 44px; font-size: 1.1rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 600; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.daypick button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 0; font-size: .8rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; }
.daypick button small { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.daypick button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.daypick button[aria-pressed="true"] small { color: inherit; opacity: .8; }
.shop { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.shop li + li { border-top: 1px solid var(--line); }
.shop label { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; cursor: pointer; }
.shop input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 1px 0 0; }
.shop .it { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.shop .it small { color: var(--muted); font-size: .8rem; }
.shop input:checked ~ .it { color: var(--muted); text-decoration: line-through; }
.shop .rm { margin-left: auto; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 16px; }
.done-h { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pane { min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.list-pane { display: flex; flex-direction: column; }
.detail-pane { display: none; background: var(--surface); }
body.show-detail .list-pane { display: none; }
body.show-detail .detail-pane { display: block; }
@media (min-width: 820px) {
  .app { grid-template-columns: minmax(320px, 380px) 1fr; }
  .list-pane { display: flex !important; border-right: 1px solid var(--line); }
  .detail-pane { display: block; }
  .back-btn { display: none !important; }
}

.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 820px) {
  .detail-pane .wrap { padding-left: 40px; padding-right: max(40px, env(safe-area-inset-right, 0px)); }
  .list-pane .wrap { padding-right: 16px; }
}

/* En-tête de la liste */
.list-head {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  display: flex; flex-direction: column; gap: 12px; padding-block: 16px 12px;
}
.title-row { display: flex; align-items: center; gap: 8px; }
.title-row h1 { font-size: 1.75rem; flex: 1; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 44px;
}
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; font-size: 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: .9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .n { font-size: .78rem; opacity: .7; font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select {
  height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 10px; font-size: .9rem;
}
.count { font-size: .85rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

/* Liste */
.cards { list-style: none; margin: 0; padding-block: 4px 32px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cards > .empty { grid-column: 1 / -1; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 8px; height: 100%;
  width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 0 0 12px; overflow: hidden;
}
.card .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 0; font-size: 2.4rem; }
.card .card-body { padding-inline: 12px; }
.card .fav { position: absolute; top: 8px; right: 8px; }
.card .fav:not(:empty) { background: var(--surface); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; box-shadow: var(--shadow); }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
@media (min-width: 820px) {
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 8px; height: auto; }
  .card .thumb { width: 72px; height: 72px; aspect-ratio: auto; border-radius: 12px; font-size: 1.6rem; }
  .card .card-body { padding-inline: 0; }
  .card .fav { position: static; }
  .card .fav:not(:empty) { box-shadow: none; background: none; }
}
.thumb {
  width: 64px; height: 64px; border-radius: 12px; object-fit: cover; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; color: #fff;
  background: linear-gradient(135deg, hsl(var(--h, 220) 90% 64%), hsl(calc(var(--h, 220) + 45) 85% 70%));
}
.card-body { min-width: 0; }
.card-title { font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin-top: 3px; }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.meta svg { width: 13px; height: 13px; }
.fav { color: var(--gold); }
.fav svg { width: 18px; height: 18px; }
.badge-ex { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty h2 { color: var(--ink); font-size: 1.3rem; margin-bottom: 6px; }

/* Fiche recette */
.detail-top {
  position: sticky; top: 0; z-index: 5; background: var(--surface);
  display: flex; align-items: center; gap: 8px; padding-block: 12px;
}
.detail-top .spacer { flex: 1; }
.back-btn { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 4px; }
.back-btn svg { width: 20px; height: 20px; }
.hero-img { width: 100%; max-width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: var(--radius); display: block; }
.thumb.hero-ph { aspect-ratio: 16 / 6; width: 100%; height: auto; font-size: 3.2rem; border-radius: var(--radius); }
.detail { padding-block: 4px 24px; max-width: 760px; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { display: inline-block; font-size: .78rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; }
.detail h2 { font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.15; margin-top: 8px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { display: flex; flex-direction: column; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; }
.portions-row { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.portions-row .servings b { font-size: 1.05rem; min-width: 110px; text-align: center; }
.portions-row small { color: var(--muted); font-size: .8rem; }
.actionbar {
  position: sticky; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; gap: 10px; padding-block: 10px;
}
.actionbar .btn { flex: 1; min-width: 0; white-space: nowrap; padding: 12px 10px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; font-size: .95rem; }
.actionbar .btn svg { width: 18px; height: 18px; }
.fact b { font-size: 1.1rem; font-variant-numeric: tabular-nums; font-weight: 600; }
.fact small { color: var(--muted); font-size: .8rem; }
.servings { display: inline-flex; align-items: center; gap: 8px; }
.servings button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 1.1rem; line-height: 1; }
.cols { display: grid; grid-template-columns: 1fr; gap: 26px; }
@media (min-width: 1100px) { .cols { grid-template-columns: minmax(220px, 1fr) 1.6fr; } }
.section-h { font-family: var(--font-display); font-size: 1.15rem; margin-bottom: 8px; }
.ingredients { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ingredients li { border-bottom: 1px solid var(--line); }
.ingredients label { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; cursor: pointer; }
.ingredients input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 2px; flex: none; }
.ingredients input:checked + span { color: var(--muted); text-decoration: line-through; }
.qty { font-weight: 600; font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: flex; flex-direction: column; gap: 14px; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 32px 1fr; gap: 12px; }
.steps li::before {
  content: counter(step); width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums;
}
.notes { background: var(--bg); border-radius: var(--radius); padding: 14px 16px; white-space: pre-wrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .82rem; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.detail-empty { height: 100%; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 40px; }
.detail-empty h2 { color: var(--ink); font-size: 1.5rem; margin-bottom: 6px; }

/* Feuille d'édition */
.sheet-back { position: fixed; inset: 0; background: rgba(10, 16, 12, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .sheet-back { align-items: center; padding: 24px; } }
.sheet {
  background: var(--surface); width: 100%; max-width: 680px; max-height: 100%; overflow-y: auto;
  border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (min-width: 700px) { .sheet { border-radius: 18px; max-height: calc(100% - 20px); } }
.sheet-head {
  position: sticky; top: 0; background: var(--surface); z-index: 2; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; padding-block: 12px;
}
.sheet-head h2 { flex: 1; font-size: 1.25rem; text-align: center; }
.txt-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 6px; }
.txt-btn.strong { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 8px 16px; }
.form { display: flex; flex-direction: column; gap: 16px; padding-block: 16px 28px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: .85rem; font-weight: 600; color: var(--muted); }
.field small { color: var(--muted); font-size: .8rem; }
.field input, .field textarea, .field select {
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; font-size: 16px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.photo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.photo-row img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .9rem;
}
.btn.danger { color: var(--danger); }
.source-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; text-decoration: none; word-break: break-all; }
.source-link svg { width: 16px; height: 16px; flex: none; }
.choice { display: flex; flex-direction: column; gap: 10px; padding-block: 16px 24px; }
.choice .btn { text-align: left; padding: 14px 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; }
.choice .btn small { font-weight: 400; color: var(--muted); }
.danger-zone { border-top: 1px solid var(--line); padding-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Menu & confirmations */
.menu { display: flex; flex-direction: column; gap: 10px; padding-block: 16px 24px; }
.menu p { margin: 0; color: var(--muted); font-size: .9rem; }
.menu .btn { text-align: left; padding: 12px 16px; border-radius: 12px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: .9rem; box-shadow: var(--shadow);
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="shell">
<main class="views">
<div class="app view">
  <section class="pane list-pane" aria-label="Liste des recettes">
    <div class="list-head wrap">
      <div class="title-row">
        <h1>Yumi</h1>
        <button class="icon-btn" id="menuBtn" aria-label="Sauvegarde et réglages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
        </button>
        <button class="icon-btn primary" id="addBtn" aria-label="Ajouter une recette">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>

      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

          <option value="20">≤ 20 min</option>
          <option value="45">≤ 45 min</option>

        </select>
        <select id="sort" aria-label="Trier">
          <option value="alpha">A → Z</option>
          <option value="recent">Plus récentes</option>
          <option value="time">Plus rapides</option>

    <ul class="cards wrap" id="cards"></ul>

  <section class="pane detail-pane" id="detailPane" aria-label="Recette"></section>

  <button class="tab" role="tab" data-view="semaine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semaine</button>
  <button class="tab" role="tab" data-view="courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.1L20.5 8H7"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>Courses</button>

  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>

<input type="file" id="photoFile" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";

  // ---------- Stockage (IndexedDB, avec repli en mémoire) ----------
  const DB_NAME = "mes-recettes", STORE = "kv", KEY = "recettes";
  let dbp = null;
  function openDb() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function load(key = KEY) {
    try {
      const db = await openDb();
      return await new Promise((res, rej) => {
        const t = db.transaction(STORE).objectStore(STORE).get(key);
        t.onsuccess = () => res(t.result || null);
        t.onerror = () => rej(t.error);
      });
    } catch { return null; }
  }
  let saveWarned = false;
  async function put(key, value) {
    try {
      const db = await openDb();
      await new Promise((res, rej) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch {
      if (!saveWarned) { toast("Enregistrement impossible sur cet appareil"); saveWarned = true; }
    }
  }
  // Chaque modification est datée (par recette, par semaine) pour fusionner proprement
  // les changements faits sur l'iPhone et sur l'iPad.
  let meta = { recettes: {}, planning: {}, courses: {}, supprimees: {} };
  const snap = { recettes: {}, planning: {}, courses: {} };
  const current = (kind) => kind === "recettes" ? Object.fromEntries(recipes.map((r) => [r.id, r])) : kind === "planning" ? plan : shop;
  function snapshot() {
    for (const kind of ["recettes", "planning", "courses"]) {
      snap[kind] = Object.fromEntries(Object.entries(current(kind)).map(([k, v]) => [k, JSON.stringify(v)]));
    }
  }
  function stamp(kind) {
    const now = Date.now(), cur = current(kind), sn = snap[kind];
    for (const [k, v] of Object.entries(cur)) {
      const j = JSON.stringify(v);
      if (!(k in sn) && (j === "[]" || j === '{"coches":{},"extras":[]}')) continue;   // semaine juste consultée, pas modifiée
      if (sn[k] !== j) { meta[kind][k] = now; sn[k] = j; if (kind === "recettes") delete meta.supprimees[k]; }
    }
    for (const k of Object.keys(sn)) if (!(k in cur)) {
      delete sn[k];
      if (kind === "recettes") { meta.supprimees[k] = now; delete meta.recettes[k]; } else meta[kind][k] = now;
    }
  }
  function save(key = KEY) {
    const kind = key === KEY ? "recettes" : key;
    stamp(kind);
    put(key, { recettes: recipes, planning: plan, courses: shop }[kind]);
    put("meta", meta);
    sync.soon();
  }
  function persistAll() {
    put(KEY, recipes); put("planning", plan); put("courses", shop); put("meta", meta);
  }

  // ---------- Synchronisation (Supabase, via son API REST) ----------
  const sync = (() => {
    let cfg = null, timer = null, running = false, again = false;
    const DEFAULT = window.RECETTES_CONFIG || {};
    const status = { last: 0, error: "" };
    async function init() {
      cfg = (await load("sync")) || {};
      if (!cfg.url && DEFAULT.supabaseUrl) cfg.url = DEFAULT.supabaseUrl;
      if (!cfg.key && DEFAULT.supabaseKey) cfg.key = DEFAULT.supabaseKey;
    }
    const base = () => cfg.url.replace(/\/+$/, "");
    async function auth(body, grant) {
      const r = await fetch(`${base()}/auth/v1/token?grant_type=${grant}`, {
        method: "POST", headers: { apikey: cfg.key, "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Connexion refusée");
      cfg.session = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in - 60) * 1000, user: j.user.id, email: j.user.email };
      put("sync", cfg);
    }
    async function token() {
      if (Date.now() > cfg.session.exp) await auth({ refresh_token: cfg.session.refresh }, "refresh_token");
      return cfg.session.access;
    }
    async function rest(method, body, path = "donnees" + (method === "GET" ? "?select=data" : "")) {
      const t = await token();
      const r = await fetch(`${base()}/rest/v1/${path}`, {
        method, body: body ? JSON.stringify(body) : undefined,
        headers: { apikey: cfg.key, Authorization: "Bearer " + t, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || `Erreur serveur ${r.status}`); }
      return method === "GET" ? r.json() : null;
    }
    function merge(remote) {
      const rm = remote.meta || { recettes: {}, planning: {}, courses: {}, supprimees: {} };
      const local = current("recettes"), far = Object.fromEntries((remote.recettes || []).map((r) => [r.id, r]));
      const out = [];
      for (const id of new Set([...Object.keys(local), ...Object.keys(far), ...Object.keys(rm.supprimees || {})])) {
        const lt = local[id] ? meta.recettes[id] || 0 : -1, rt = far[id] ? (rm.recettes || {})[id] || 0 : -1;
        const tomb = Math.max(meta.supprimees[id] || 0, (rm.supprimees || {})[id] || 0);
        const win = lt >= rt ? local[id] : far[id], wt = Math.max(lt, rt);
        if (tomb && tomb >= wt) { meta.supprimees[id] = tomb; delete meta.recettes[id]; continue; }
        if (win) { out.push(win); meta.recettes[id] = wt; delete meta.supprimees[id]; }
      }
      recipes = out;
      for (const [kind, farObj] of [["planning", remote.planning || {}], ["courses", remote.courses || {}]]) {
        const loc = current(kind), fm = rm[kind] || {};
        for (const w of new Set([...Object.keys(loc), ...Object.keys(farObj)])) {
          if ((fm[w] || 0) > (meta[kind][w] || 0)) {
            if (w in farObj) loc[w] = farObj[w]; else delete loc[w];
            meta[kind][w] = fm[w];
          }
        }
      }
      if (state.selected && !recipes.some((r) => r.id === state.selected)) state.selected = null;
      snapshot(); persistAll();
    }
    async function run() {
      if (!connected()) return;
      if (running) { again = true; return; }
      running = true;
      try {
        const rows = await rest("GET");
        if (rows[0] && rows[0].data) { merge(rows[0].data); render(); }
        await pullShared();
        await rest("POST", { user_id: cfg.session.user, data: { recettes: recipes, planning: plan, courses: shop, meta } });
        status.last = Date.now(); status.error = "";
      } catch (e) {
        status.error = navigator.onLine === false ? "Hors connexion, la synchro reprendra plus tard" : e.message;
      } finally {
        running = false;
        if (again) { again = false; run(); }
        refreshMenu();
      }
    }
    // Recettes envoyées par le raccourci « Partager » d'iOS (table a_importer).
    async function pullShared() {
      let rows;
      try { rows = await rest("GET", null, "a_importer?select=id,url,texte,image&order=id"); } catch { return; }
      if (!rows.length) return;
      rows.forEach((x) => {
        const r = parseRecipe(x.texte || "", x.url || "");
        const img = (x.image || "").replace(/\s/g, "");
        recipes.push({ ...r, id: uid(), favori: false, creeLe: Date.now(), aVerifier: true,
          photo: !img ? "" : img.startsWith("http") || img.startsWith("data:") ? img : "data:image/jpeg;base64," + img });
      });
      stamp("recettes"); persistAll();
      await rest("DELETE", null, "a_importer?id=in.(" + rows.map((x) => x.id).join(",") + ")");
      state.sort = "recent"; $("#sort").value = "recent"; render();
      toast(rows.length > 1 ? `${rows.length} recettes ajoutées depuis le partage` : "Recette ajoutée depuis le partage");
    }
    const connected = () => !!(cfg && cfg.url && cfg.key && cfg.session);
    return {
      init, run, status, connected,
      cfg: () => cfg,
      soon() { if (!connected()) return; clearTimeout(timer); timer = setTimeout(run, 1200); },
      async login(url, key, email, password) {
        cfg.url = url.trim(); cfg.key = key.trim();
        await auth({ email: email.trim(), password }, "password");
        await run();
      },
      logout() { delete cfg.session; put("sync", cfg); refreshMenu(); },
      hasDefault: () => !!(DEFAULT.supabaseUrl && DEFAULT.supabaseKey),
    };
  })();
  let refreshMenu = () => {};

  // ---------- Exemples ----------
  const SAMPLES = [
    { titre: "Quiche lorraine", categorie: "Plats", prep: 20, cuisson: 40, portions: 6, tags: ["four", "classique"],
      ingredients: ["1 pâte brisée", "200 g de lardons", "3 œufs", "20 cl de crème fraîche", "20 cl de lait", "1 pincée de muscade", "Sel, poivre"],
      etapes: ["Préchauffer le four à 180 °C.", "Faire revenir les lardons à sec, puis les égoutter.", "Battre les œufs avec la crème, le lait et la muscade. Saler peu, poivrer.", "Étaler la pâte dans le moule, piquer le fond, répartir les lardons et verser l'appareil.", "Cuire 40 min jusqu'à ce que le dessus soit doré."],
      notes: "Encore meilleure tiède avec une salade verte." },
    { titre: "Velouté de potimarron", categorie: "Soupes", prep: 15, cuisson: 30, portions: 4, tags: ["automne", "végétarien"],
      ingredients: ["1 potimarron (1,2 kg)", "1 oignon", "2 pommes de terre", "1 L de bouillon de légumes", "10 cl de crème liquide", "1 c. à soupe d'huile d'olive"],
      etapes: ["Laver le potimarron, l'épépiner et le couper en cubes (la peau se mange).", "Faire suer l'oignon émincé dans l'huile.", "Ajouter potimarron, pommes de terre et bouillon. Cuire 25 à 30 min.", "Mixer en ajoutant la crème. Rectifier l'assaisonnement."], notes: "" },
    { titre: "Salade de lentilles au chèvre", categorie: "Entrées", prep: 15, cuisson: 20, portions: 4, tags: ["froid", "végétarien"],
      ingredients: ["250 g de lentilles vertes", "1 échalote", "100 g de chèvre frais", "1 bouquet de persil", "3 c. à soupe d'huile de noix", "1 c. à soupe de vinaigre de cidre", "1 c. à café de moutarde"],
      etapes: ["Cuire les lentilles 20 min dans l'eau non salée, puis égoutter.", "Préparer la vinaigrette : moutarde, vinaigre, huile, sel et poivre.", "Mélanger les lentilles tièdes avec l'échalote ciselée et la vinaigrette.", "Ajouter le chèvre émietté et le persil au moment de servir."], notes: "" },
    { titre: "Fondant au chocolat", categorie: "Desserts", prep: 15, cuisson: 22, portions: 8, tags: ["chocolat", "four"], favori: true,
      ingredients: ["200 g de chocolat noir", "150 g de beurre", "150 g de sucre", "4 œufs", "50 g de farine"],
      etapes: ["Préchauffer le four à 180 °C.", "Faire fondre le chocolat et le beurre au bain-marie.", "Fouetter les œufs et le sucre, puis incorporer le chocolat fondu.", "Ajouter la farine, verser dans un moule beurré.", "Cuire 20 à 22 min : le centre doit rester tremblotant."], notes: "Laisser refroidir avant de démouler." },
    { titre: "Pancakes moelleux", categorie: "Petit-déjeuner", prep: 10, cuisson: 15, portions: 4, tags: ["rapide"],
      ingredients: ["250 g de farine", "1 sachet de levure chimique", "2 œufs", "30 cl de lait", "40 g de sucre", "30 g de beurre fondu", "1 pincée de sel"],
      etapes: ["Mélanger farine, levure, sucre et sel.", "Ajouter les œufs, puis le lait petit à petit et le beurre fondu.", "Laisser reposer 10 min.", "Cuire des petites louches dans une poêle chaude, 1 à 2 min par face."], notes: "" },
    { titre: "Sauce pesto au basilic", categorie: "Sauces", prep: 10, cuisson: 0, portions: 4, tags: ["rapide", "végétarien"], favori: true,
      ingredients: ["1 gros bouquet de basilic", "50 g de parmesan", "30 g de pignons de pin", "1 gousse d'ail", "10 cl d'huile d'olive"],
      etapes: ["Torréfier légèrement les pignons à sec.", "Mixer basilic, ail, pignons et parmesan.", "Ajouter l'huile en filet jusqu'à la texture voulue."], notes: "Se conserve 4 jours au frais, couvert d'un filet d'huile." },
    { titre: "Poulet basquaise", categorie: "Plats", prep: 25, cuisson: 50, portions: 4, tags: ["mijoté"],
      ingredients: ["4 cuisses de poulet", "2 poivrons rouges", "1 poivron vert", "2 oignons", "4 tomates", "2 gousses d'ail", "1 c. à café de piment d'Espelette", "2 c. à soupe d'huile d'olive"],
      etapes: ["Dorer les cuisses de poulet dans l'huile, puis réserver.", "Faire revenir oignons et poivrons en lanières 10 min.", "Ajouter tomates, ail et piment, puis remettre le poulet.", "Couvrir et mijoter 40 min à feu doux."], notes: "" },
  ];
  const now = Date.now();
  const makeSamples = () => SAMPLES.map((r, i) => ({
    id: "ex-" + (i + 1), favori: false, notes: "", tags: [], photo: "", exemple: true,
    creeLe: now - (SAMPLES.length - i) * 86400000, ...r,
  }));

  // ---------- État ----------
  let recipes = [];
  let plan = {};                 // { "2026-10-19": [{ id, jour: 0-6, repas: "midi"|"soir", recette, personnes }] }
  let shop = {};                 // { "2026-10-19": { coches: { cle: true }, extras: [{ id, texte, coche }] } }
  const state = { view: "recettes", week: null, q: "", cat: "", fav: false, maxTime: 0, sort: "alpha", selected: null, portions: null };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const total = (r) => (Number(r.prep) || 0) + (Number(r.cuisson) || 0);
  const fmtMin = (m) => { m = Number(m) || 0; if (!m) return "—"; const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} h ${String(r).padStart(2, "0")}` : `${h} h`) : `${r} min`; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const ICON = {
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1L3.2 9.4l6.1-.8z"/></svg>',
    starO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1L3.2 9.4l6.1-.8z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
    people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.6 2.4 3 5.2"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v4M10 15h4"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  };

  // ---------- Quantités : mise à l'échelle des portions ----------
  const FRAC = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3 };
  function parseQty(line) {
    const m = String(line).match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])(?=\s|[a-zA-Zµ]|$)/);
    if (!m) return null;
    let raw = m[1], v;
    if (FRAC[raw]) v = FRAC[raw];
    else if (/\s/.test(raw)) { const [a, b] = raw.split(/\s+/); const [n, d] = b.split("/"); v = +a + n / d; }
    else if (raw.includes("/")) { const [n, d] = raw.split("/"); v = n / d; }
    else v = parseFloat(raw.replace(",", "."));
    return { v, len: m[0].length };
  }
  function fmtQty(v) {
    const r = Math.round(v * 100) / 100;
    const whole = Math.floor(r), f = r - whole;
    const near = [[.25, "¼"], [.5, "½"], [.75, "¾"], [1 / 3, "⅓"], [2 / 3, "⅔"]].find(([x]) => Math.abs(f - x) < .04);
    if (near && whole < 10) return (whole ? whole + " " : "") + near[1];
    return String(r).replace(".", ",");
  }
  function scaleLine(line, factor) {
    const p = parseQty(line);
    if (!p || factor === 1) return p ? `<span class="qty">${esc(line.slice(0, p.len))}</span>${esc(line.slice(p.len))}` : esc(line);
    return `<span class="qty">${esc(fmtQty(p.v * factor))}</span>${esc(line.slice(p.len))}`;
  }

  // Teinte du visuel par défaut, stable pour une catégorie (bleus, violets, roses).
  const hueOf = (c) => { let h = 0; for (const ch of norm(c || "")) h = (h * 31 + ch.charCodeAt(0)) % 997; return 190 + (h % 110); };

  // ---------- Rendu de la liste ----------
  function categories() {
    const map = new Map();
    recipes.forEach((r) => { const c = (r.categorie || "Sans catégorie").trim(); map.set(c, (map.get(c) || 0) + 1); });
    return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0], "fr"));
  }
  function filtered() {
    const terms = norm(state.q).split(/\s+/).filter(Boolean);
    let list = recipes.filter((r) => {
      if (state.cat && (r.categorie || "Sans catégorie") !== state.cat) return false;
      if (state.fav && !r.favori) return false;
      if (state.maxTime && total(r) > state.maxTime) return false;
      if (terms.length) {
        const hay = norm([r.titre, r.categorie, (r.tags || []).join(" "), (r.ingredients || []).join(" "), r.notes].join(" "));
        if (!terms.every((t) => hay.includes(t))) return false;
      }
      return true;
    });
    const by = { alpha: (a, b) => a.titre.localeCompare(b.titre, "fr"), recent: (a, b) => (b.creeLe || 0) - (a.creeLe || 0), time: (a, b) => total(a) - total(b) };
    return list.sort(by[state.sort]);
  }
  function renderChips() {
    const cats = categories();
    if (state.cat && !cats.some(([c]) => c === state.cat)) state.cat = "";
    $("#chips").innerHTML = [`<button class="chip" data-cat="" aria-pressed="${!state.cat}">Toutes <span class="n">${recipes.length}</span></button>`]
      .concat(cats.map(([c, n]) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${esc(c)} <span class="n">${n}</span></button>`)).join("");
  }
  function renderList() {

  // ---------- Rendu de la fiche ----------
  function renderDetail() {

    $("#backBtn").onclick = () => { state.selected = null; render(); };
    $("#editBtn").onclick = () => openEditor(r);
    $("#planBtn").onclick = () => openAddToPlan(r, cur || 2);
