  function render() {
    document.body.classList.remove("v-recettes", "v-semaine", "v-courses");
    document.body.classList.add("v-" + state.view);
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.view === state.view));
    if (state.view === "recettes") { renderChips(); renderList(); renderDetail(); }
    else if (state.view === "semaine") renderPlan();
    else renderShop();
  }
  document.querySelector(".tabbar").addEventListener("click", (e) => {
    const t = e.target.closest(".tab"); if (!t) return;
    state.view = t.dataset.view; render();
  });

  // ---------- Semaines ----------
  const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  const fromIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
  const dShort = (d) => d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  function weekLabel(w) {
    const a = fromIso(w), b = fromIso(addDays(w, 6));
    const cur = iso(mondayOf(new Date()));
    const rel = w === cur ? "Cette semaine" : w === addDays(cur, 7) ? "Semaine prochaine" : w === addDays(cur, -7) ? "Semaine dernière" : "";
    return { rel, range: `${dShort(a)} – ${dShort(b)}` };
  }
  function weekNavHtml() {
    const { rel, range } = weekLabel(state.week);
    return `<div class="weeknav"><button class="icon-btn" data-wk="-7" aria-label="Semaine précédente">${ICON.back}</button>
      <b>${rel ? `${rel}<br><small style="font-weight:400;color:var(--muted)">${range}</small>` : range}</b>
      <button class="icon-btn" data-wk="7" aria-label="Semaine suivante" style="transform:scaleX(-1)">${ICON.back}</button></div>`;
  }
  function bindWeekNav(root) {
    root.querySelectorAll("[data-wk]").forEach((b) => b.onclick = () => { state.week = addDays(state.week, +b.dataset.wk); render(); });
  }
  const entries = (w) => plan[w] || (plan[w] = []);

  // ---------- Planning ----------
  function renderPlan() {
    const w = state.week, list = entries(w), today = iso(new Date());
    const known = list.filter((e) => recipes.some((r) => r.id === e.recette));
    const v = $("#planView");
    v.innerHTML = `<div class="page wrap">
      <div class="page-head"><h1>Semaine</h1>${weekNavHtml()}</div>
      <div class="summary"><span>${known.length} repas prévu${known.length > 1 ? "s" : ""}</span>
        ${known.length ? `<button class="btn accent" id="toShop">Voir la liste de courses</button>` : `<span>Touchez « + Ajouter » sur un jour, ou le bouton calendrier d'une recette.</span>`}</div>
      <div class="days">${JOURS.map((j, i) => {
        const date = addDays(w, i);
        return `<section class="day${date === today ? " today" : ""}">
          <div class="day-h"><h3>${j}</h3><small>${dShort(fromIso(date))}</small>${date === today ? '<span class="now">Aujourd\'hui</span>' : ""}</div>
          ${["midi", "soir"].map((m) => {
            const items = known.filter((e) => e.jour === i && e.repas === m);
            return `<div class="slot"><div class="slot-h"><span>${m === "midi" ? "Midi" : "Soir"}</span><button data-add="${i}|${m}">+ Ajouter</button></div>
              ${items.map((e) => { const r = recipes.find((x) => x.id === e.recette); return `<div class="meal">
                <button class="name" data-open="${esc(r.id)}">${esc(r.titre)}</button>
                <span class="mini"><button data-pp="${e.id}|-1" aria-label="Moins de personnes">−</button><span>${e.personnes}&nbsp;pers.</span><button data-pp="${e.id}|1" aria-label="Plus de personnes">+</button></span>
                <button class="rm" data-rm="${e.id}" aria-label="Retirer ${esc(r.titre)}">×</button></div>`; }).join("") || '<div class="slot-empty">Rien de prévu</div>'}
            </div>`;
          }).join("")}
        </section>`;
      }).join("")}</div></div>`;
    bindWeekNav(v);
    const t = $("#toShop"); if (t) t.onclick = () => { state.view = "courses"; render(); };
    v.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => { const [j, m] = b.dataset.add.split("|"); openRecipePicker(+j, m); });
    v.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => { state.view = "recettes"; state.selected = b.dataset.open; state.portions = null; render(); });
    v.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { plan[w] = list.filter((e) => e.id !== b.dataset.rm); save("planning"); renderPlan(); });
    v.querySelectorAll("[data-pp]").forEach((b) => b.onclick = () => {
      const [id, d] = b.dataset.pp.split("|"); const e = list.find((x) => x.id === id);
      e.personnes = Math.max(1, e.personnes + +d); save("planning"); renderPlan();
    });
  }
  function addToPlan(w, jour, repas, recette, personnes) {
    entries(w).push({ id: uid(), jour, repas, recette, personnes });
    save("planning");
  }
  function openRecipePicker(jour, repas) {
    const sorted = [...recipes].sort((a, b) => a.titre.localeCompare(b.titre, "fr"));
    openSheet(`
      <div class="sheet-head wrap"><span style="width:70px"></span><h2>${JOURS[jour]} ${repas === "midi" ? "midi" : "soir"}</h2><button class="txt-btn" id="closePick" style="width:70px">Fermer</button></div>
      <div class="wrap" style="padding-top:12px;display:flex;flex-direction:column;gap:10px">
        <label class="search"><input id="pickQ" type="search" placeholder="Chercher une recette" autocomplete="off" aria-label="Chercher une recette"></label>
        <div style="display:flex;align-items:center;gap:10px"><span style="font-weight:600">Personnes</span>
          <span class="servings"><button id="ppM" aria-label="Moins">−</button><b id="ppV">${state.lastPersonnes || 2}</b><button id="ppP" aria-label="Plus">+</button></span></div>
      </div>
      <div class="picker wrap" id="pickList"></div>`);
    let pp = state.lastPersonnes || 2;
    $("#ppM").onclick = () => { pp = Math.max(1, pp - 1); $("#ppV").textContent = pp; };
    $("#ppP").onclick = () => { pp++; $("#ppV").textContent = pp; };
    const draw = () => {
      const terms = norm($("#pickQ").value).split(/\s+/).filter(Boolean);
      const l = sorted.filter((r) => terms.every((t) => norm(r.titre + " " + r.categorie).includes(t)));
      $("#pickList").innerHTML = l.map((r) => `<button class="pick" data-id="${esc(r.id)}">
        ${r.photo ? `<img class="thumb" src="${esc(r.photo)}" alt="">` : `<span class="thumb" style="--h:${hueOf(r.categorie)}" aria-hidden="true">${esc(r.titre.charAt(0).toUpperCase())}</span>`}
        <span class="card-body"><span class="card-title">${esc(r.titre)}</span><span class="meta"><span>${esc(r.categorie || "Sans catégorie")}</span><span>${fmtMin(total(r))}</span></span></span></button>`).join("")
        || '<div class="empty">Aucune recette trouvée</div>';
    };
    draw();
    $("#pickQ").oninput = draw;
    $("#closePick").onclick = closeSheet;
    $("#pickList").onclick = (e) => {
      const b = e.target.closest(".pick"); if (!b) return;
      state.lastPersonnes = pp;
      addToPlan(state.week, jour, repas, b.dataset.id, pp); closeSheet(); renderPlan(); toast("Ajouté au planning");
    };
  }
  function openAddToPlan(r, personnes) {
    let w = state.week, jour = Math.min(6, Math.max(0, Math.round((fromIso(iso(new Date())) - fromIso(w)) / 86400000))), repas = "soir", pp = personnes;
    if (jour < 0 || jour > 6) jour = 0;
    const draw = () => {
      const { rel, range } = weekLabel(w);
      openSheet(`
        <div class="sheet-head wrap"><button class="txt-btn" id="cancelAp">Annuler</button><h2>Planifier</h2><button class="txt-btn strong" id="okAp">Ajouter</button></div>
        <div class="form wrap">
          <div style="font-weight:600">${esc(r.titre)}</div>
          <div class="weeknav" style="justify-content:space-between"><button class="icon-btn" id="apPrev" aria-label="Semaine précédente">${ICON.back}</button><b>${rel || range}${rel ? `<br><small style="font-weight:400;color:var(--muted)">${range}</small>` : ""}</b><button class="icon-btn" id="apNext" aria-label="Semaine suivante" style="transform:scaleX(-1)">${ICON.back}</button></div>
          <div class="daypick">${JOURS.map((j, i) => `<button data-j="${i}" aria-pressed="${i === jour}">${j.slice(0, 3)}<small>${fromIso(addDays(w, i)).getDate()}</small></button>`).join("")}</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
            <div class="seg"><button data-m="midi" aria-pressed="${repas === "midi"}">Midi</button><button data-m="soir" aria-pressed="${repas === "soir"}">Soir</button></div>
            <span class="servings"><button id="apM" aria-label="Moins de personnes">−</button><b>${pp}</b><button id="apP" aria-label="Plus de personnes">+</button></span><span style="color:var(--muted)">personne${pp > 1 ? "s" : ""}</span>
          </div>
        </div>`);
      $("#cancelAp").onclick = closeSheet;
      $("#apPrev").onclick = () => { w = addDays(w, -7); draw(); };
      $("#apNext").onclick = () => { w = addDays(w, 7); draw(); };
      document.querySelectorAll("[data-j]").forEach((b) => b.onclick = () => { jour = +b.dataset.j; draw(); });
      document.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { repas = b.dataset.m; draw(); });
      $("#apM").onclick = () => { pp = Math.max(1, pp - 1); draw(); };
      $("#apP").onclick = () => { pp++; draw(); };
      $("#okAp").onclick = () => { addToPlan(w, jour, repas, r.id, pp); state.week = w; closeSheet(); toast(`Ajouté : ${JOURS[jour].toLowerCase()} ${repas}`); };
    };
    draw();
  }

  // ---------- Liste de courses ----------
  const UNITS = [
    [/^(kg|kilos?|kilogrammes?)$/, "g", 1000], [/^(g|gr|grammes?)$/, "g", 1], [/^mg$/, "g", .001],
    [/^(l|litres?)$/, "ml", 1000], [/^(dl)$/, "ml", 100], [/^(cl)$/, "ml", 10], [/^(ml)$/, "ml", 1],
    [/^(c\. ?a soupe|c\. ?a s\.?|cas|cuilleres? a soupe|cs)$/, "c. à soupe", 1],
    [/^(c\. ?a cafe|c\. ?a c\.?|cac|cuilleres? a cafe|cc)$/, "c. à café", 1],
    [/^(pincees?)$/, "pincée", 1], [/^(sachets?)$/, "sachet", 1], [/^(gousses?)$/, "gousse", 1], [/^(tranches?)$/, "tranche", 1],
    [/^(bouquets?)$/, "bouquet", 1], [/^(boites?|boîtes?)$/, "boîte", 1], [/^(brins?)$/, "brin", 1], [/^(feuilles?)$/, "feuille", 1],
    [/^(verres?)$/, "verre", 1], [/^(tasses?)$/, "tasse", 1], [/^(pots?)$/, "pot", 1], [/^(paquets?)$/, "paquet", 1],
  ];
  function parseIngredient(line) {
    const p = parseQty(line);
    let rest = p ? line.slice(p.len).trim() : line.trim(), unit = "", mult = 1;
    if (p) {
      const n = norm(rest);
      for (const [re, u, m] of UNITS) {
        const src = re.source.slice(1, -1);
        const mm = n.match(new RegExp("^(" + src + ")(?=\\s|$|\\b)"));
        if (mm) { unit = u; mult = m; rest = rest.slice(mm[0].length).trim(); break; }
      }
    }
    rest = rest.replace(/^(de |d'|d’|des |du )/i, "").replace(/\s*\(.*?\)\s*/g, " ").trim();
    const key = norm(rest).replace(/s\b/g, "").replace(/[^a-z0-9 ]/g, "").trim();
    return { qty: p ? p.v * mult : null, unit, name: rest || line.trim(), key: (p ? unit || "u" : "-") + "|" + key };
  }
  function fmtAmount(q, unit) {
    if (q == null) return "";
    if (unit === "ml" && q > 50) q = Math.round(q / 10) * 10;
    if (unit === "g" && q > 20) q = Math.round(q / 5) * 5;
    if (!unit) q = Math.ceil(q - 0.05);   // on n'achète pas ⅓ d'œuf
    if (unit === "g" && q >= 1000) return fmtQty(q / 1000) + " kg";
    if (unit === "ml" && q >= 1000) return fmtQty(q / 1000) + " L";
    if (unit === "ml" && q >= 10 && q % 10 === 0) return fmtQty(q / 10) + " cl";
    if (unit === "g" || unit === "ml") return Math.round(q) + " " + unit;
    return fmtQty(Math.round(q * 4) / 4 || q) + (unit ? " " + unit + (q > 1 && !unit.startsWith("c.") ? "s" : "") : "");
  }
  function shopItems(w) {
    const map = new Map();
    entries(w).forEach((e) => {
      const r = recipes.find((x) => x.id === e.recette); if (!r) return;
      const f = Number(r.portions) ? e.personnes / Number(r.portions) : 1;
      (r.ingredients || []).forEach((line) => {
        const it = parseIngredient(line);
        const cur = map.get(it.key) || { key: it.key, name: it.name, unit: it.unit, qty: it.qty == null ? null : 0, from: new Set() };
        if (it.qty != null && cur.qty != null) cur.qty += it.qty * f;
        cur.from.add(r.titre);
        map.set(it.key, cur);
      });
    });
    return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, "fr"));
  }
  const shopOf = (w) => shop[w] || (shop[w] = { coches: {}, extras: [] });
  function renderShop() {
    const w = state.week, s = shopOf(w), items = shopItems(w);
    const all = items.map((it) => ({ id: "i:" + it.key, label: it.name, amount: fmtAmount(it.qty, it.unit), from: [...it.from].join(", "), done: !!s.coches[it.key], key: it.key }))
      .concat(s.extras.map((x) => ({ id: "x:" + x.id, label: x.texte, amount: "", from: "Ajouté à la main", done: !!x.coche, extra: x.id })));
    const todo = all.filter((x) => !x.done), done = all.filter((x) => x.done);
    const li = (x) => `<li><label><input type="checkbox" data-ck="${esc(x.id)}" ${x.done ? "checked" : ""}>
      <span class="it"><span>${x.amount ? `<span class="qty">${esc(x.amount)}</span> ` : ""}${esc(x.label)}</span><small>${esc(x.from)}</small></span>
      ${x.extra ? `<button class="rm" data-rmx="${esc(x.extra)}" aria-label="Retirer">×</button>` : ""}</label></li>`;
    const v = $("#shopView");
    v.innerHTML = `<div class="page wrap" style="max-width:720px">
      <div class="page-head"><h1>Courses</h1>${weekNavHtml()}</div>
      <div class="summary"><span>${todo.length} article${todo.length > 1 ? "s" : ""} à acheter</span>
        ${all.length ? `<button class="btn" id="copyShop">Copier la liste</button>` : ""}
        ${done.length ? `<button class="btn" id="uncheck">Tout décocher</button>` : ""}</div>
      ${!items.length ? `<div class="empty" style="padding:24px 0"><h2>Liste vide</h2>Ajoutez des recettes au planning de cette semaine, leurs ingrédients apparaîtront ici avec les quantités pour le bon nombre de personnes.</div>` : ""}
      <form class="addrow" id="addExtra"><input id="extraIn" placeholder="Ajouter un article (ex. papier toilette)" autocomplete="off" aria-label="Ajouter un article"><button class="btn accent" type="submit">Ajouter</button></form>
      ${todo.length ? `<ul class="shop">${todo.map(li).join("")}</ul>` : ""}
      ${done.length ? `<div class="done-h">Dans le panier</div><ul class="shop">${done.map(li).join("")}</ul>` : ""}
    </div>`;
    bindWeekNav(v);
    v.querySelectorAll("[data-ck]").forEach((c) => c.onchange = () => {
      const id = c.dataset.ck;
      if (id.startsWith("i:")) s.coches[id.slice(2)] = c.checked; else { const x = s.extras.find((y) => y.id === id.slice(2)); x.coche = c.checked; }
      save("courses"); renderShop();
    });
    v.querySelectorAll("[data-rmx]").forEach((b) => b.onclick = (e) => { e.preventDefault(); s.extras = s.extras.filter((x) => x.id !== b.dataset.rmx); save("courses"); renderShop(); });
    $("#addExtra").onsubmit = (e) => { e.preventDefault(); const t = $("#extraIn").value.trim(); if (!t) return; s.extras.push({ id: uid(), texte: t, coche: false }); save("courses"); renderShop(); $("#extraIn").focus(); };
    const u = $("#uncheck"); if (u) u.onclick = () => { s.coches = {}; s.extras.forEach((x) => x.coche = false); save("courses"); renderShop(); };
    const c = $("#copyShop"); if (c) c.onclick = async () => {
      const txt = `Courses (${weekLabel(w).range})\n` + todo.map((x) => "- " + (x.amount ? x.amount + " " : "") + x.label).join("\n");
      try { await navigator.clipboard.writeText(txt); toast("Liste copiée"); } catch { toast("Copie impossible ici"); }
    };
  }

  // ---------- Feuilles (édition, menu, confirmation) ----------
  function openSheet(html) { $("#sheet").innerHTML = html; $("#sheetBack").hidden = false; document.body.style.overflow = "hidden"; }
  function closeSheet() { $("#sheetBack").hidden = true; $("#sheet").innerHTML = ""; document.body.style.overflow = ""; }
  $("#sheetBack").addEventListener("click", (e) => { if (e.target.id === "sheetBack") closeSheet(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheetBack").hidden) closeSheet(); });

  let draftPhoto = "";
  function openEditor(r, prefill) {
    const isNew = !r || !!prefill;
    if (prefill) r = prefill;
    r = r || { titre: "", source: "", categorie: state.cat || "", prep: "", cuisson: "", portions: 4, ingredients: [], etapes: [], notes: "", tags: [] };
    draftPhoto = r.photo || "";
    const cats = categories().map(([c]) => c);
    openSheet(`
      <div class="sheet-head wrap">
        <button class="txt-btn" id="cancelEd">Annuler</button>
        <h2>${isNew ? "Nouvelle recette" : "Modifier"}</h2>
        <button class="txt-btn strong" id="saveEd">Enregistrer</button>
      </div>
      <form class="form wrap" id="edForm" novalidate>
        <label class="field"><span>Nom de la recette</span><input id="f-titre" required value="${esc(r.titre)}" placeholder="Ex. Tarte aux pommes"></label>
        <label class="field"><span>Catégorie</span><input id="f-cat" list="catList" value="${esc(r.categorie)}" placeholder="Ex. Desserts"><datalist id="catList">${cats.map((c) => `<option value="${esc(c)}">`).join("")}</datalist></label>
        <div class="row3">
          <label class="field"><span>Prépa (min)</span><input id="f-prep" type="number" inputmode="numeric" min="0" value="${esc(r.prep)}"></label>
          <label class="field"><span>Cuisson (min)</span><input id="f-cuisson" type="number" inputmode="numeric" min="0" value="${esc(r.cuisson)}"></label>
          <label class="field"><span>Portions</span><input id="f-portions" type="number" inputmode="numeric" min="0" value="${esc(r.portions)}"></label>
        </div>
        <label class="field"><span>Ingrédients</span><textarea id="f-ing" placeholder="Un ingrédient par ligne&#10;200 g de farine&#10;3 œufs">${esc((r.ingredients || []).join("\n"))}</textarea><small>Un par ligne. Commencez par la quantité pour qu'elle s'ajuste aux portions.</small></label>
        <label class="field"><span>Étapes</span><textarea id="f-etapes" placeholder="Une étape par ligne">${esc((r.etapes || []).join("\n"))}</textarea><small>Une étape par ligne.</small></label>
        <label class="field"><span>Notes</span><textarea id="f-notes" style="min-height:70px">${esc(r.notes)}</textarea></label>
        <label class="field"><span>Mots-clés</span><input id="f-tags" value="${esc((r.tags || []).join(", "))}" placeholder="végétarien, rapide, été"><small>Séparés par des virgules.</small></label>
        <label class="field"><span>Lien d'origine</span><input id="f-source" type="url" inputmode="url" value="${esc(r.source)}" placeholder="https://www.instagram.com/p/…"></label>
        <div class="field"><span>Photo</span>
          <div class="photo-row"><img id="f-photo-prev" alt="" ${draftPhoto ? `src="${esc(draftPhoto)}"` : "hidden"}>
            <button type="button" class="btn" id="pickPhoto">${draftPhoto ? "Changer la photo" : "Ajouter une photo"}</button>
            <button type="button" class="btn danger" id="rmPhoto" ${draftPhoto ? "" : "hidden"}>Retirer</button>
          </div>
        </div>
        ${isNew ? "" : `<div class="danger-zone"><button type="button" class="btn danger" id="delEd">Supprimer la recette</button><span id="delConfirm" hidden><button type="button" class="btn danger" id="delYes">Oui, supprimer</button></span></div>`}
      </form>`);
    $("#f-titre").focus({ preventScroll: true });
    $("#cancelEd").onclick = closeSheet;
    $("#edForm").onsubmit = (e) => { e.preventDefault(); doSave(); };
    $("#saveEd").onclick = doSave;
    $("#pickPhoto").onclick = () => $("#photoFile").click();
    $("#rmPhoto").onclick = () => { draftPhoto = ""; $("#f-photo-prev").hidden = true; $("#rmPhoto").hidden = true; $("#pickPhoto").textContent = "Ajouter une photo"; };
    if (!isNew) {
      $("#delEd").onclick = () => { $("#delConfirm").hidden = false; $("#delEd").textContent = "Annuler"; $("#delEd").onclick = () => openEditor(r); };
      $("#delYes").onclick = () => {
        recipes = recipes.filter((x) => x.id !== r.id); state.selected = null; save(); closeSheet(); render(); toast("Recette supprimée");
      };
    }
    function doSave() {
      const titre = $("#f-titre").value.trim();
      if (!titre) { $("#f-titre").focus(); toast("Donnez un nom à la recette"); return; }
      const lines = (s) => s.split("\n").map((x) => x.trim()).filter(Boolean);
      const data = {
        titre, categorie: $("#f-cat").value.trim(),
        prep: Number($("#f-prep").value) || 0, cuisson: Number($("#f-cuisson").value) || 0, portions: Number($("#f-portions").value) || 0,
        ingredients: lines($("#f-ing").value), etapes: lines($("#f-etapes").value), notes: $("#f-notes").value.trim(),
        tags: $("#f-tags").value.split(",").map((t) => t.trim().replace(/^#/, "")).filter(Boolean), photo: draftPhoto, source: $("#f-source").value.trim(),
      };
      if (isNew) { const n = { id: uid(), favori: false, creeLe: Date.now(), ...data }; recipes.push(n); state.selected = n.id; }
      else { Object.assign(r, data, { exemple: false, aVerifier: false }); }
      state.portions = null;
      save(); closeSheet(); render(); toast(isNew ? "Recette ajoutée" : "Recette enregistrée");
    }
  }

  $("#photoFile").addEventListener("change", (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1000, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      draftPhoto = c.toDataURL("image/jpeg", 0.78); URL.revokeObjectURL(url);
      const prev = $("#f-photo-prev"); if (!prev) return;
      prev.src = draftPhoto; prev.hidden = false; $("#rmPhoto").hidden = false; $("#pickPhoto").textContent = "Changer la photo";
    };
    img.onerror = () => toast("Cette image n'a pas pu être lue");
    img.src = url;
  });

  // ---------- Ajout depuis Instagram, Facebook… ----------
  function openAddChoice() {
    openSheet(`
      <div class="sheet-head wrap"><span style="width:70px"></span><h2>Ajouter</h2><button class="txt-btn" id="closeAdd" style="width:70px">Fermer</button></div>
      <div class="choice wrap">
        <button class="btn" id="addBlank">Écrire une recette<small>Remplir la fiche à la main</small></button>
        <button class="btn" id="addPaste">Coller depuis Instagram, Facebook…<small>Collez la légende de la publication et son lien, la fiche se remplit toute seule</small></button>
      </div>`);
    $("#closeAdd").onclick = closeSheet;
    $("#addBlank").onclick = () => openEditor(null);
    $("#addPaste").onclick = () => openPaste();
  }
  function openPaste(texte = "", lien = "") {
    openSheet(`
      <div class="sheet-head wrap"><button class="txt-btn" id="cancelPaste">Annuler</button><h2>Coller une recette</h2><button class="txt-btn strong" id="goPaste">Continuer</button></div>
      <div class="form wrap">
        <p style="margin:0;color:var(--muted);font-size:.9rem">Dans Instagram ou Facebook, touchez ••• puis « Copier le lien ». Pour le texte, appuyez longuement sur la légende et copiez-la.</p>
        <label class="field"><span>Lien de la publication</span><input id="p-url" type="url" inputmode="url" value="${esc(lien)}" placeholder="https://www.instagram.com/p/…"></label>
        <label class="field"><span>Texte de la recette</span><textarea id="p-text" style="min-height:220px" placeholder="Collez ici la légende avec les ingrédients et les étapes">${esc(texte)}</textarea><small>Vous pourrez tout vérifier et corriger avant d'enregistrer.</small></label>
      </div>`);
    $("#cancelPaste").onclick = closeSheet;
    $("#goPaste").onclick = () => {
      const t = $("#p-text").value, u = $("#p-url").value.trim();
      if (!t.trim() && !u) { toast("Collez au moins un lien ou un texte"); return; }
      openEditor(null, parseRecipe(t, u));
    };
  }
  function sourceName(url) {
    try {
      const h = new URL(url).hostname.replace(/^www\.|^m\./, "");
      return ({ "instagram.com": "Instagram", "facebook.com": "Facebook", "fb.watch": "Facebook", "tiktok.com": "TikTok", "youtube.com": "YouTube", "youtu.be": "YouTube", "pinterest.com": "Pinterest", "pin.it": "Pinterest" })[h] || h;
    } catch { return "lien"; }
  }
  // Lit une légende de réseau social et en sort titre, ingrédients, étapes, mots-clés.
  function parseRecipe(text, url) {
    const ta = document.createElement("textarea"); ta.innerHTML = String(text || ""); text = ta.value.replace(/\r/g, "");
    // Légende lue par le raccourci : « 1 234 likes, 56 comments - compte on 3 octobre 2026: "…" »
    text = text.replace(/^[^\n"]*?(likes?|J’aime|J'aime|mentions? J’aime)[^\n"]*?:\s*"([\s\S]*?)"?\.?\s*$/i, "$2");
    if (!url) { const m = text.match(/https?:\/\/\S+/); if (m) url = m[0]; }
    text = text.replace(/https?:\/\/\S+/g, "");
    const tags = [...new Set((text.match(/#[\p{L}\p{N}_]+/gu) || []).map((t) => t.slice(1).toLowerCase()))].slice(0, 8);
    const clean = (l) => l.replace(/#[\p{L}\p{N}_]+/gu, "")
      .replace(/^[\s\p{Extended_Pictographic}️‍•·▪▫◦●○■□►▶➡→✓✔☑✅\-–—*+]+/u, "")
      .replace(/[\p{Extended_Pictographic}️‍]+/gu, " ").replace(/\s{2,}/g, " ").trim();
    const raw = text.split("\n");
    const head = (l) => {
      const c = norm(clean(l)).replace(/[:：\s]+$/, "");
      if (/^(les )?ingredients?( pour .*)?$|^il (vous )?faut$|^pour \d+ (personnes|parts)/.test(c)) return "ing";
      if (/^(la )?(preparation|recette|etapes?|instructions?|deroule|methode|realisation)$/.test(c)) return "step";
      return null;
    };
    let titre = "", mode = null, ingredients = [], etapes = [], notes = [], portions = 0, prep = 0, cuisson = 0;
    raw.forEach((l) => {
      const c = clean(l); if (!c) return;
      const n = norm(c);
      const pm = n.match(/pour (\d+) (personnes?|parts?|pers)/) || n.match(/(\d+) (personnes|portions|parts)/) || n.match(/^pour (\d+)\b/); if (pm && !portions) portions = +pm[1];
      if (/^pour \d+\b/.test(n) && c.length < 40) return;
      const pr = n.match(/prep\w*\s*:?\s*(\d+)\s*(min|h)/); if (pr && !prep) prep = +pr[1] * (pr[2] === "h" ? 60 : 1);
      const cu = n.match(/cuisson\s*:?\s*(\d+)\s*(min|h)/); if (cu && !cuisson) cuisson = +cu[1] * (cu[2] === "h" ? 60 : 1);
      const h = head(l);
      if (h) {
        mode = h;
        const after = c.split(/[:：]/).slice(1).join(":").trim();
        if (after) (h === "ing" ? ingredients : etapes).push(after);
        return;
      }
      if (!titre && c.length <= 80 && !parseQty(c)) { titre = c.replace(/[:!.]+$/, ""); return; }
      if (pr || cu) return;
      const step = c.replace(/^(\d+\s*[.)\-:]|[①-⑳]|etape \d+\s*:?)\s*/i, "");
      if (mode === "ing") ingredients.push(c);
      else if (mode === "step") etapes.push(step);
      else if (parseQty(c) && c.length < 70) ingredients.push(c);
      else if (/^\d+\s*[.)]/.test(c) || /^etape/i.test(n)) etapes.push(step);
      else notes.push(c);
    });
    // Sans titres de section : les longues phrases deviennent des étapes.
    if (!etapes.length && notes.length) { etapes = notes.filter((x) => x.length > 25); notes = notes.filter((x) => x.length <= 25); }
    return {
      titre: titre || (url ? "Recette " + sourceName(url) : ""), categorie: guessCategory(norm(text)), source: url || "",
      prep, cuisson, portions: portions || 4, ingredients, etapes, notes: notes.join("\n"), tags,
    };
  }
  function guessCategory(n) {
    const cats = categories().map(([c]) => c);
    const rules = [[/gateau|cake|tarte|cookie|brownie|mousse|creme|dessert|chocolat|crepe|tiramisu|cheesecake/, "Desserts"],
      [/soupe|veloute|potage/, "Soupes"], [/sauce|pesto|vinaigrette|mayonnaise/, "Sauces"],
      [/pancake|granola|porridge|brunch|petit.dej/, "Petit-déjeuner"], [/salade|entree|tartinade|houmous/, "Entrées"],
      [/cocktail|smoothie|boisson|limonade/, "Boissons"], [/poulet|boeuf|porc|poisson|saumon|pates|curry|gratin|risotto|plat/, "Plats"]];
    const hit = rules.find(([re]) => re.test(n));
    return hit ? (cats.find((c) => norm(c) === norm(hit[1])) || hit[1]) : "";
  }

  function syncSectionHtml() {
    const c = sync.cfg() || {}, st = sync.status;
    if (sync.connected()) {
      const when = st.last ? new Date(st.last).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
      return `<h3 class="section-h" style="margin:0">Synchronisation</h3>
        <p>Connecté avec <b>${esc(c.session.email)}</b>. Vos recettes, votre semaine et vos courses sont les mêmes sur tous vos appareils.</p>
        <p id="syncState" style="color:${st.error ? "var(--danger)" : "var(--muted)"}">${st.error ? esc(st.error) : when ? "Dernière synchro à " + when : "Synchro en cours…"}</p>
        <button class="btn" id="syncNow">Synchroniser maintenant</button>
        <button class="btn" id="logout">Se déconnecter de cet appareil</button>`;
    }
    return `<h3 class="section-h" style="margin:0">Synchronisation</h3>
      <p>Connectez-vous pour retrouver les mêmes recettes sur l'iPhone et l'iPad.</p>
      <form id="loginForm" style="display:flex;flex-direction:column;gap:10px">
        ${sync.hasDefault() ? "" : `<label class="field"><span>Adresse du projet Supabase</span><input id="s-url" type="url" value="${esc(c.url || "")}" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
        <label class="field"><span>Clé publique (anon)</span><input id="s-key" value="${esc(c.key || "")}" autocomplete="off"></label>`}
        <label class="field"><span>Email</span><input id="s-email" type="email" autocomplete="username" value="${esc((c.session || {}).email || "")}"></label>
        <label class="field"><span>Mot de passe</span><input id="s-pass" type="password" autocomplete="current-password"></label>
        <p id="loginErr" style="color:var(--danger)" hidden></p>
        <button class="btn accent" type="submit">Se connecter</button>
      </form>`;
  }
  function bindSync() {
    const f = $("#loginForm");
    if (f) f.onsubmit = async (e) => {
      e.preventDefault();
      const c = sync.cfg(), btn = f.querySelector("button[type=submit]"), err = $("#loginErr");
      const url = $("#s-url") ? $("#s-url").value : c.url, key = $("#s-key") ? $("#s-key").value : c.key;
      if (!url || !key || !$("#s-email").value || !$("#s-pass").value) { err.textContent = "Remplissez tous les champs."; err.hidden = false; return; }
      btn.disabled = true; btn.textContent = "Connexion…";
      try { await sync.login(url, key, $("#s-email").value, $("#s-pass").value); toast("Connecté, recettes synchronisées"); refreshMenu(); }
      catch (x) { err.textContent = /fetch|network|load/i.test(x.message) ? "Impossible de joindre Supabase. Vérifiez l'adresse et la connexion." : x.message === "Invalid login credentials" ? "Email ou mot de passe incorrect." : x.message; err.hidden = false; btn.disabled = false; btn.textContent = "Se connecter"; }
    };
    const n = $("#syncNow"); if (n) n.onclick = () => { $("#syncState").textContent = "Synchro en cours…"; sync.run(); };
    const l = $("#logout"); if (l) l.onclick = () => { sync.logout(); toast("Déconnecté"); };
  }
  function openMenu() {
    const nEx = recipes.filter((r) => r.exemple).length;
    openSheet(`
      <div class="sheet-head wrap"><span style="width:70px"></span><h2>Réglages</h2><button class="txt-btn" id="closeMenu" style="width:70px">Fermer</button></div>
      <div class="menu wrap">
        <div id="syncBox" style="display:flex;flex-direction:column;gap:10px">${syncSectionHtml()}</div>
        <h3 class="section-h" style="margin:8px 0 0">Sauvegarde</h3>
        <p>Exportez vos recettes dans un fichier pour les garder en lieu sûr (par exemple dans iCloud Drive).</p>
        <button class="btn" id="exportBtn">Exporter mes recettes (.json)</button>
        <button class="btn" id="copyBtn">Copier les recettes (texte JSON)</button>
        <button class="btn" id="importBtn">Importer un fichier de recettes</button>
        ${nEx ? `<button class="btn danger" id="rmEx">Retirer les ${nEx} recettes d'exemple</button>` : ""}
      </div>`);
    $("#closeMenu").onclick = closeSheet;
    bindSync();
    refreshMenu = () => { const b = $("#syncBox"); if (b && !$("#loginForm")) { b.innerHTML = syncSectionHtml(); bindSync(); } else if (b && sync.connected()) { b.innerHTML = syncSectionHtml(); bindSync(); } };
    $("#exportBtn").onclick = exportJson;
    $("#copyBtn").onclick = async () => {
      try { await navigator.clipboard.writeText(JSON.stringify(exportData(), null, 2)); toast("Recettes copiées"); }
      catch { toast("Copie impossible ici, utilisez l'export"); }
    };
    $("#importBtn").onclick = () => $("#importFile").click();
    if (nEx) $("#rmEx").onclick = () => {
      recipes = recipes.filter((r) => !r.exemple);
      if (!recipes.some((r) => r.id === state.selected)) state.selected = null;
      save(); closeSheet(); render(); toast("Exemples retirés");
    };
  }
  const exportData = () => ({ app: "mes-recettes", version: 2, exporteLe: new Date().toISOString(), recettes: recipes, planning: plan, courses: shop });
  async function exportJson() {
    const name = `recettes-${new Date().toISOString().slice(0, 10)}.json`;
    const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type: "application/json" });
    try {
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Yumi" }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $("#importFile").addEventListener("change", async (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data.recettes;
      if (!Array.isArray(list)) throw new Error();
      let added = 0, updated = 0;
      list.forEach((r) => {
        if (!r || !r.titre) return;
        const i = recipes.findIndex((x) => x.id === r.id);
        if (i >= 0) { recipes[i] = r; updated++; } else { recipes.push({ ...r, id: r.id || uid() }); added++; }
      });
      if (data.planning && typeof data.planning === "object") { plan = { ...plan, ...data.planning }; save("planning"); }
      if (data.courses && typeof data.courses === "object") { shop = { ...shop, ...data.courses }; save("courses"); }
      save(); closeSheet(); render(); toast(`${added} ajoutée${added > 1 ? "s" : ""}, ${updated} mise${updated > 1 ? "s" : ""} à jour`);
    } catch { toast("Ce fichier n'est pas un export de recettes"); }
  });

  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2400); }

  // ---------- Événements ----------
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
  $("#chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; state.cat = b.dataset.cat; renderChips(); renderList(); });
  $("#favFilter").addEventListener("click", (e) => { state.fav = !state.fav; e.currentTarget.setAttribute("aria-pressed", state.fav); renderList(); });
  $("#timeFilter").addEventListener("change", (e) => { state.maxTime = Number(e.target.value) || 0; renderList(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; renderList(); });
  $("#cards").addEventListener("click", (e) => {
    const b = e.target.closest(".card"); if (!b) return;
    state.selected = b.dataset.id; state.portions = null; renderList(); renderDetail();
    $("#detailPane").scrollTop = 0;
  });
  $("#addBtn").addEventListener("click", openAddChoice);
  $("#menuBtn").addEventListener("click", openMenu);

  // ---------- Démarrage ----------
  state.week = iso(mondayOf(new Date()));
  (async () => {
    const stored = await load();
    recipes = Array.isArray(stored) ? stored : makeSamples();
    plan = (await load("planning")) || {};
    shop = (await load("courses")) || {};
    meta = { recettes: {}, planning: {}, courses: {}, supprimees: {}, ...((await load("meta")) || {}) };
    if (!Array.isArray(stored)) {
      // Exemple de planning pour la semaine en cours
      [[0, "soir", "ex-2", 2], [2, "soir", "ex-1", 4], [4, "midi", "ex-3", 2], [5, "soir", "ex-7", 4], [6, "midi", "ex-5", 4]]
        .forEach(([j, m, r, p]) => entries(state.week).push({ id: uid(), jour: j, repas: m, recette: r, personnes: p }));
      // Les exemples sont datés « très ancien » : toute vraie donnée synchronisée passe devant.
      recipes.forEach((r) => (meta.recettes[r.id] = 1));
      meta.planning[state.week] = 1;
      persistAll();
    }
    snapshot();
    await sync.init();
    if (window.matchMedia("(min-width: 820px)").matches && recipes.length) state.selected = [...recipes].sort((a, b) => a.titre.localeCompare(b.titre, "fr"))[0].id;
    render();
    const params = new URLSearchParams(location.search);
    if (params.has("texte") || params.has("url")) {
      history.replaceState(null, "", location.pathname);
      openEditor(null, { ...parseRecipe(params.get("texte") || "", params.get("url") || ""), photo: params.get("image") || "" });
    }
    sync.run();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync.run(); });
    window.addEventListener("online", () => sync.run());
  })();
  render();

  if ("serviceWorker" in navigator && location.protocol === "https:" && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
