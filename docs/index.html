/* Yumi — design system « Frais & Moderne ».
   Les tokens de marque viennent de yumi-design-tokens.css (pack de marque) ; tout le reste en dérive.
   Mise en page : iPhone = une colonne, onglets en bas ; iPad = liste + fiche côte à côte, semaine en grille. */
:root {
  color-scheme: light;
  /* Marque */
  --primary: #08796B;

  --muted: #667875;
  --line: #DDE8E3;
  --success: #16866F;
  --danger: #D94B70;
  --scrim: rgba(9, 28, 25, .42);
  --glass: rgba(255, 255, 255, .86);
  --tint-primary: #E3F2EE;
  --tint-rose: #FFE8F0;
  --tint-yellow: #FFF5DB;
  --tint-mint: #E2F6EE;
  /* Formes */
  --r-card: 20px;
  --r-control: 14px;
  --r-pill: 999px;
  --shadow-card: 0 6px 22px rgba(20, 58, 50, .07);
  --shadow-float: 0 10px 30px rgba(20, 58, 50, .16);
  /* Espacements (multiples de 4) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  --tap: 44px;
  /* Typo */

  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --t-xs: .75rem; --t-sm: .8125rem; --t-md: .9375rem; --t-base: 1rem; --t-lg: 1.125rem; --t-xl: 1.375rem; --t-2xl: 1.75rem; --t-3xl: 2.125rem;

    --bg: #0D171B; --surface: #142329; --surface-2: #1C3036; --ink: #F1F7F4; --muted: #A2B8B2; --line: #294149;

<script>
(() => {
  "use strict";

  // ---------- Stockage (IndexedDB, avec repli en mémoire) ----------
  const DB_NAME = "mes-recettes", STORE = "kv", KEY = "recettes";
  let dbp = null;
  function openDb() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function load(key = KEY) {
    try {
      const db = await openDb();
      return await new Promise((res, rej) => {
        const t = db.transaction(STORE).objectStore(STORE).get(key);
        t.onsuccess = () => res(t.result || null);
        t.onerror = () => rej(t.error);
      });
    } catch { return null; }
  }
  let saveWarned = false;
  async function put(key, value) {
    try {
      const db = await openDb();
      await new Promise((res, rej) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch {
      if (!saveWarned) { toast("Enregistrement impossible sur cet appareil"); saveWarned = true; }
    }
  }
  // Chaque modification est datée (par recette, par semaine) pour fusionner proprement
  // les changements faits sur l'iPhone et sur l'iPad.
  let meta = { recettes: {}, planning: {}, courses: {}, supprimees: {} };
  const snap = { recettes: {}, planning: {}, courses: {} };
  const current = (kind) => kind === "recettes" ? Object.fromEntries(recipes.map((r) => [r.id, r])) : kind === "planning" ? plan : shop;
  function snapshot() {
    for (const kind of ["recettes", "planning", "courses"]) {
      snap[kind] = Object.fromEntries(Object.entries(current(kind)).map(([k, v]) => [k, JSON.stringify(v)]));
    }
  }
  function stamp(kind) {
    const now = Date.now(), cur = current(kind), sn = snap[kind];
    for (const [k, v] of Object.entries(cur)) {
      const j = JSON.stringify(v);
      if (!(k in sn) && (j === "[]" || j === '{"coches":{},"extras":[]}')) continue;   // semaine juste consultée, pas modifiée
      if (sn[k] !== j) { meta[kind][k] = now; sn[k] = j; if (kind === "recettes") delete meta.supprimees[k]; }
    }
    for (const k of Object.keys(sn)) if (!(k in cur)) {
      delete sn[k];
      if (kind === "recettes") { meta.supprimees[k] = now; delete meta.recettes[k]; } else meta[kind][k] = now;
    }
  }
  function save(key = KEY) {
    const kind = key === KEY ? "recettes" : key;
    stamp(kind);
    put(key, { recettes: recipes, planning: plan, courses: shop }[kind]);
    put("meta", meta);
    sync.soon();
  }
  function persistAll() {
    put(KEY, recipes); put("planning", plan); put("courses", shop); put("meta", meta);
  }

  // ---------- Synchronisation (Supabase, via son API REST) ----------
  const sync = (() => {
    let cfg = null, timer = null, running = false, again = false;
    const DEFAULT = window.RECETTES_CONFIG || {};
    const status = { last: 0, error: "" };
    async function init() {
      cfg = (await load("sync")) || {};
      if (!cfg.url && DEFAULT.supabaseUrl) cfg.url = DEFAULT.supabaseUrl;
      if (!cfg.key && DEFAULT.supabaseKey) cfg.key = DEFAULT.supabaseKey;
    }
    const base = () => cfg.url.replace(/\/+$/, "");
    async function auth(body, grant) {
      const r = await fetch(`${base()}/auth/v1/token?grant_type=${grant}`, {
        method: "POST", headers: { apikey: cfg.key, "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Connexion refusée");
      cfg.session = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in - 60) * 1000, user: j.user.id, email: j.user.email };
      put("sync", cfg);
    }
    async function token() {
      if (Date.now() > cfg.session.exp) await auth({ refresh_token: cfg.session.refresh }, "refresh_token");
      return cfg.session.access;
    }
    async function rest(method, body, path = "donnees" + (method === "GET" ? "?select=data" : "")) {
      const t = await token();
      const r = await fetch(`${base()}/rest/v1/${path}`, {
        method, body: body ? JSON.stringify(body) : undefined,
        headers: { apikey: cfg.key, Authorization: "Bearer " + t, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
      });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || `Erreur serveur ${r.status}`); }
      return method === "GET" ? r.json() : null;
    }
    function merge(remote) {
      const rm = remote.meta || { recettes: {}, planning: {}, courses: {}, supprimees: {} };
      const local = current("recettes"), far = Object.fromEntries((remote.recettes || []).map((r) => [r.id, r]));
      const out = [];
      for (const id of new Set([...Object.keys(local), ...Object.keys(far), ...Object.keys(rm.supprimees || {})])) {
        const lt = local[id] ? meta.recettes[id] || 0 : -1, rt = far[id] ? (rm.recettes || {})[id] || 0 : -1;
        const tomb = Math.max(meta.supprimees[id] || 0, (rm.supprimees || {})[id] || 0);
        const win = lt >= rt ? local[id] : far[id], wt = Math.max(lt, rt);
        if (tomb && tomb >= wt) { meta.supprimees[id] = tomb; delete meta.recettes[id]; continue; }
        if (win) { out.push(win); meta.recettes[id] = wt; delete meta.supprimees[id]; }
      }
      recipes = out;
      for (const [kind, farObj] of [["planning", remote.planning || {}], ["courses", remote.courses || {}]]) {
        const loc = current(kind), fm = rm[kind] || {};
        for (const w of new Set([...Object.keys(loc), ...Object.keys(farObj)])) {
          if ((fm[w] || 0) > (meta[kind][w] || 0)) {
            if (w in farObj) loc[w] = farObj[w]; else delete loc[w];
            meta[kind][w] = fm[w];
          }
        }
      }
      if (state.selected && !recipes.some((r) => r.id === state.selected)) state.selected = null;
      snapshot(); persistAll();
    }
    async function run() {
      if (!connected()) return;
      if (running) { again = true; return; }
      running = true;
      try {
        const rows = await rest("GET");
        if (rows[0] && rows[0].data) { merge(rows[0].data); render(); }
        await pullShared();
        await rest("POST", { user_id: cfg.session.user, data: { recettes: recipes, planning: plan, courses: shop, meta } });
        status.last = Date.now(); status.error = "";
      } catch (e) {
        status.error = navigator.onLine === false ? "Hors connexion, la synchro reprendra plus tard" : e.message;
      } finally {
        running = false;
        if (again) { again = false; run(); }
        refreshMenu();
      }
    }
    // Recettes envoyées par le raccourci « Partager » d'iOS (table a_importer).
    async function pullShared() {
      let rows;
      try { rows = await rest("GET", null, "a_importer?select=*&order=id"); } catch { return; }
      if (!rows.length) return;
      rows.forEach((x) => {
        const img = (x.image || "").replace(/\s/g, "");
        const r = depuisPublication({ texte: x.texte, recette: x.recette, images: x.recette?.images,
          image: !img ? "" : img.startsWith("http") || img.startsWith("data:") ? img : "data:image/jpeg;base64," + img }, x.url || "");
        recipes.push({ ...r, id: uid(), favori: false, creeLe: Date.now(), aVerifier: true });
      });
      stamp("recettes"); persistAll();
      await rest("DELETE", null, "a_importer?id=in.(" + rows.map((x) => x.id).join(",") + ")");
      state.sort = "recent"; $("#sort").value = "recent"; render();
      toast(rows.length > 1 ? `${rows.length} recettes ajoutées depuis le partage` : "Recette ajoutée depuis le partage");
    }
    const connected = () => !!(cfg && cfg.url && cfg.key && cfg.session);
    return {
      init, run, status, connected,
      cfg: () => cfg,
      soon() { if (!connected()) return; clearTimeout(timer); timer = setTimeout(run, 1200); },
      async login(url, key, email, password) {
        cfg.url = url.trim(); cfg.key = key.trim();
        await auth({ email: email.trim(), password }, "password");
        await run();
      },
      logout() { delete cfg.session; put("sync", cfg); refreshMenu(); },
      hasDefault: () => !!(DEFAULT.supabaseUrl && DEFAULT.supabaseKey),
    };
  })();
  let refreshMenu = () => {};

  // ---------- Exemples ----------
  const SAMPLES = [
    { titre: "Bowl quinoa, avocat et saumon", categorie: "Plats", prep: 15, cuisson: 15, portions: 2, tags: ["healthy", "rapide"], favori: true,
      ingredients: ["150 g de quinoa", "300 g de pavés de saumon", "1 avocat", "1 concombre", "150 g de tomates cerises", "1 citron vert", "2 c. à soupe de sauce soja", "1 c. à soupe de graines de sésame"],
      etapes: ["Rincer le quinoa puis le cuire 12 min dans deux fois son volume d'eau salée. Égoutter et laisser tiédir.", "Saisir les pavés de saumon côté peau 4 min à feu vif, retourner et cuire encore 2 min. Effeuiller.", "Couper l'avocat en lamelles, le concombre en dés et les tomates cerises en deux. Arroser l'avocat de jus de citron vert.", "Répartir le quinoa dans deux bols, disposer les légumes et le saumon, arroser de sauce soja et parsemer de sésame."],
      notes: "Ajouter un peu de mangue en été. Le quinoa se prépare la veille." },
    { titre: "Quiche lorraine", categorie: "Plats", prep: 20, cuisson: 40, portions: 6, tags: ["four", "classique"],
      ingredients: ["1 pâte brisée", "200 g de lardons", "3 œufs", "20 cl de crème fraîche", "20 cl de lait", "1 pincée de muscade", "Sel, poivre"],
      etapes: ["Préchauffer le four à 180 °C.", "Faire revenir les lardons à sec, puis les égoutter.", "Battre les œufs avec la crème, le lait et la muscade. Saler peu, poivrer.", "Étaler la pâte dans le moule, piquer le fond, répartir les lardons et verser l'appareil.", "Cuire 40 min jusqu'à ce que le dessus soit bien doré."],
      notes: "Encore meilleure tiède, avec une salade verte." },
    { titre: "Velouté de potimarron", categorie: "Soupes", prep: 15, cuisson: 30, portions: 4, tags: ["automne", "végétarien"],
      ingredients: ["1 potimarron (1,2 kg)", "1 oignon", "2 pommes de terre", "1 L de bouillon de légumes", "10 cl de crème liquide", "1 c. à soupe d'huile d'olive"],
      etapes: ["Laver le potimarron, l'épépiner et le couper en cubes : la peau se mange.", "Faire suer l'oignon émincé dans l'huile 5 min.", "Ajouter le potimarron, les pommes de terre et le bouillon. Cuire 25 à 30 min.", "Mixer en ajoutant la crème. Rectifier l'assaisonnement."],
      notes: "Servir avec des graines de courge torréfiées." },
    { titre: "Salade de lentilles au chèvre", categorie: "Entrées", prep: 15, cuisson: 20, portions: 4, tags: ["froid", "végétarien"],
      ingredients: ["250 g de lentilles vertes", "1 échalote", "100 g de chèvre frais", "1 bouquet de persil", "3 c. à soupe d'huile de noix", "1 c. à soupe de vinaigre de cidre", "1 c. à café de moutarde"],
      etapes: ["Cuire les lentilles 20 min dans l'eau non salée, puis égoutter.", "Préparer la vinaigrette : moutarde, vinaigre, huile, sel et poivre.", "Mélanger les lentilles tièdes avec l'échalote ciselée et la vinaigrette.", "Ajouter le chèvre émietté et le persil au moment de servir."], notes: "" },
    { titre: "Tarte fine aux légumes d'été", categorie: "Entrées", prep: 20, cuisson: 25, portions: 4, tags: ["été", "végétarien", "four"],
      ingredients: ["1 pâte feuilletée", "1 courgette", "2 tomates", "1 poivron jaune", "100 g de ricotta", "2 c. à soupe d'huile d'olive", "1 c. à café d'herbes de Provence"],
      etapes: ["Préchauffer le four à 200 °C.", "Étaler la pâte sur une plaque et la tartiner de ricotta en laissant un bord de 2 cm.", "Disposer les légumes coupés en fines rondelles, en les faisant se chevaucher.", "Arroser d'huile, parsemer d'herbes, saler, poivrer et cuire 25 min."], notes: "" },
    { titre: "Fondant au chocolat", categorie: "Desserts", prep: 15, cuisson: 22, portions: 8, tags: ["chocolat", "four"], favori: true,
      ingredients: ["200 g de chocolat noir", "150 g de beurre", "150 g de sucre", "4 œufs", "50 g de farine"],
      etapes: ["Préchauffer le four à 180 °C.", "Faire fondre le chocolat et le beurre au bain-marie.", "Fouetter les œufs et le sucre, puis incorporer le chocolat fondu.", "Ajouter la farine et verser dans un moule beurré.", "Cuire 20 à 22 min : le centre doit rester tremblotant."],
      notes: "Laisser refroidir 15 min avant de démouler." },
    { titre: "Pancakes moelleux", categorie: "Petit-déjeuner", prep: 10, cuisson: 15, portions: 4, tags: ["rapide", "week-end"],
      ingredients: ["250 g de farine", "1 sachet de levure chimique", "2 œufs", "30 cl de lait", "40 g de sucre", "30 g de beurre fondu", "1 pincée de sel"],
      etapes: ["Mélanger la farine, la levure, le sucre et le sel.", "Ajouter les œufs, puis le lait petit à petit et le beurre fondu.", "Laisser reposer 10 min.", "Cuire de petites louches dans une poêle chaude, 1 à 2 min par face."], notes: "" },
    { titre: "Sauce pesto au basilic", categorie: "Sauces", prep: 10, cuisson: 0, portions: 4, tags: ["rapide", "végétarien"], favori: true,
      ingredients: ["1 gros bouquet de basilic", "50 g de parmesan", "30 g de pignons de pin", "1 gousse d'ail", "10 cl d'huile d'olive"],
      etapes: ["Torréfier légèrement les pignons à sec.", "Mixer le basilic, l'ail, les pignons et le parmesan.", "Ajouter l'huile en filet jusqu'à obtenir la texture voulue."],
      notes: "Se conserve 4 jours au frais, couvert d'un filet d'huile." },
    { titre: "Poulet basquaise", categorie: "Plats", prep: 25, cuisson: 50, portions: 4, tags: ["mijoté"],
      ingredients: ["4 cuisses de poulet", "2 poivrons rouges", "1 poivron vert", "2 oignons", "4 tomates", "2 gousses d'ail", "1 c. à café de piment d'Espelette", "2 c. à soupe d'huile d'olive"],
      etapes: ["Dorer les cuisses de poulet dans l'huile, puis réserver.", "Faire revenir les oignons et les poivrons en lanières 10 min.", "Ajouter les tomates, l'ail et le piment, puis remettre le poulet.", "Couvrir et laisser mijoter 40 min à feu doux."], notes: "" },
  ];
  const now = Date.now();
  const makeSamples = () => SAMPLES.map((r, i) => ({
    id: "ex-" + (i + 1), favori: false, notes: "", tags: [], photo: "", exemple: true,
    creeLe: now - (SAMPLES.length - i) * 86400000, ...r,
  }));

  // ---------- État ----------
  let recipes = [];
  let plan = {};                 // { "2026-10-19": [{ id, jour: 0-6, repas: "midi"|"soir", recette, personnes }] }
  let shop = {};                 // { "2026-10-19": { coches: { cle: true }, retires: { cle: true }, extras: [{ id, texte, coche }] } }
  const state = { view: "recettes", week: null, q: "", cat: "", fav: false, maxTime: 0, sort: "alpha", selected: null, portions: null, from: null };
  const cooking = {};            // cases cochées pendant la cuisine : { idRecette: { ing: Set, steps: Set } }
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const total = (r) => (Number(r.prep) || 0) + (Number(r.cuisson) || 0);
  const fmtMin = (m) => { m = Number(m) || 0; if (!m) return "—"; const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} h ${String(r).padStart(2, "0")}` : `${h} h`) : `${r} min`; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;

  const svg = (body, o = {}) => `<svg viewBox="0 0 24 24" fill="${o.fill || "none"}" stroke="${o.fill ? "none" : "currentColor"}" stroke-width="${o.w || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const HEART = '<path d="M12 20.5s-7.5-4.6-7.5-10.1A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1z"/>';
  const ICON = {
    clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    star: svg(HEART, { fill: "currentColor" }),
    starO: svg(HEART),
    back: svg('<path d="m15 5-7 7 7 7"/>', { w: 2.4 }),
    next: svg('<path d="m9 5 7 7-7 7"/>', { w: 2.4 }),
    chevron: svg('<path d="m9 6 6 6-6 6"/>'),
    edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>'),
    people: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.6 2.4 3 5.2"/>'),
    cal: svg('<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v4M10 15h4"/>'),
    link: svg('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
    camera: svg('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".9" fill="currentColor"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>', { w: 2.4 }),
    minus: svg('<path d="M5 12h14"/>', { w: 2.4 }),
    x: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
    check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>', { w: 3 }),
    search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
    sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>'),

  // Illustrations quand une recette n'a pas encore de photo (une par catégorie).
  const CAT_ART = {
    "plats": '<path d="M3 17h18"/><path d="M5 17a7 7 0 0 1 14 0"/><path d="M12 8V6.5M10.5 6.5h3"/>',
    "entrees": '<path d="M4 13h16a8 8 0 0 1-16 0z"/><path d="M9 13c0-3 1.5-5.5 4.5-6.5M12.5 13c.3-2 1.5-3.6 3.5-4.3M8 12.5c-.5-1.7-1.6-2.8-3-3.3"/>',

    "petit-dejeuner": '<path d="M4 9h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H16.5"/><path d="M9 6c-.6-.8.6-1.6 0-2.7M13 6c-.6-.8.6-1.6 0-2.7"/>',
    "": '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 21V3c-2 1.5-3 4-3 7v4h3"/>',
  };
  const CATEGORIES = ["Entrées", "Plats", "Desserts", "Soupes", "Sauces", "Petit-déjeuner"];
  const catKey = (c) => { const k = norm(c).replace(/[^a-z]+/g, "-").replace(/^-|-$/g, ""); return k in CAT_ART ? k : ""; };
  // Visuel d'une recette : la photo si elle existe (avec fondu au chargement), sinon l'illustration de sa catégorie.
  function media(r, cls = "") {
    const k = catKey(r.categorie);

    return `<span class="media ${cls}">${r.photo ? `<img src="${esc(r.photo)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ok')" onerror="this.remove()">` : ""}${ph}</span>`;
  }
  const LOGO = `<svg class="logo" viewBox="0 0 600 340" role="img" aria-label="Yumi — Tes recettes. Tes repas. Tes courses.">
    <svg x="180" y="0" width="240" height="240" viewBox="0 0 1024 1024"><use href="#yumi-icon"/></svg>
    <text x="300" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="var(--muted)">Tes recettes. Tes repas. Tes courses.</text></svg>`;

  // ---------- Quantités : mise à l'échelle des portions ----------
  const FRAC = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3 };
  function parseQty(line) {
    const m = String(line).match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])(?=\s|[a-zA-Zµ]|$)/);
    if (!m) return null;
    let raw = m[1], v;
    if (FRAC[raw]) v = FRAC[raw];
    else if (/\s/.test(raw)) { const [a, b] = raw.split(/\s+/); const [n, d] = b.split("/"); v = +a + n / d; }
    else if (raw.includes("/")) { const [n, d] = raw.split("/"); v = n / d; }
    else v = parseFloat(raw.replace(",", "."));
    return { v, len: m[0].length };
  }
  function fmtQty(v) {
    const r = Math.round(v * 100) / 100;
    const whole = Math.floor(r), f = r - whole;
    const near = [[.25, "¼"], [.5, "½"], [.75, "¾"], [1 / 3, "⅓"], [2 / 3, "⅔"]].find(([x]) => Math.abs(f - x) < .04);
    if (near && whole < 10) return (whole ? whole + " " : "") + near[1];
    return String(r).replace(".", ",");
  }
  function scaleLine(line, factor) {
    const p = parseQty(line);
    if (!p) return esc(line);
    const q = factor === 1 ? line.slice(0, p.len).trim() : fmtQty(p.v * factor);
    return `<span class="qty">${esc(q)}</span> ${esc(line.slice(p.len).trim())}`;
  }

  // ---------- Recettes : liste ----------
  function categories() {
    const map = new Map(CATEGORIES.map((c) => [c, 0]));
    recipes.forEach((r) => {
      const c = (r.categorie || "").trim(); if (!c) return;
      const known = CATEGORIES.find((x) => norm(x) === norm(c)) || c;
      map.set(known, (map.get(known) || 0) + 1);
    });
    return [...map.entries()];
  }
  function filtered() {
    const terms = norm(state.q).split(/\s+/).filter(Boolean);
    let list = recipes.filter((r) => {
      if (state.cat && norm(r.categorie) !== norm(state.cat)) return false;
      if (state.fav && !r.favori) return false;
      if (state.maxTime && (!total(r) || total(r) > state.maxTime)) return false;
      if (terms.length) {
        const hay = norm([r.titre, r.categorie, (r.tags || []).join(" "), (r.ingredients || []).join(" "), r.notes].join(" "));
        if (!terms.every((t) => hay.includes(t))) return false;
      }
      return true;
    });
    const by = { alpha: (a, b) => a.titre.localeCompare(b.titre, "fr"), recent: (a, b) => (b.creeLe || 0) - (a.creeLe || 0), time: (a, b) => total(a) - total(b) };
    return list.sort(by[state.sort]);
  }
  const anyFilter = () => !!(state.q || state.cat || state.fav || state.maxTime);
  function renderChips() {
    const cats = categories();
    $("#chips").innerHTML = [`<button class="chip" data-cat="" aria-pressed="${!state.cat}">Toutes <span class="n">${recipes.length}</span></button>`]
      .concat(cats.map(([c, n]) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${esc(c)}${n ? ` <span class="n">${n}</span>` : ""}</button>`)).join("");
    $("#favFilter").setAttribute("aria-pressed", state.fav);
    $("#timeSel").value = String(state.maxTime); $("#timeSel").classList.toggle("on", !!state.maxTime);
    $("#qClear").hidden = !state.q;
  }
  function renderList() {

      $("#cards").innerHTML = `<li class="empty"><span class="ico">${ICON.search}</span><h2>Aucune recette ne correspond</h2><p>${state.q ? `Rien pour « ${esc(state.q)} »` : "Aucune recette avec ces filtres"}. Essaie un autre mot ou retire un filtre.</p><button class="btn btn-secondary" data-act="reset">Retirer les filtres</button></li>`;

      <li><button class="card" data-id="${esc(r.id)}" aria-current="${state.selected === r.id}" aria-label="${esc(r.titre)}, ${esc(r.categorie || "sans catégorie")}, ${fmtMin(total(r))}${r.favori ? ", favori" : ""}">
        <span style="position:relative;display:block">${media(r)}${r.favori ? `<span class="fav-badge">${ICON.star}</span>` : ""}</span>

        </span>

  }

  // ---------- Fiche recette ----------
  function cookState(id) { return cooking[id] || (cooking[id] = { ing: new Set(), steps: new Set() }); }
  function renderDetail() {

    const cur = state.portions || base;
    const factor = base ? cur / base : 1;
    const ck = cookState(r.id), nSteps = (r.etapes || []).length, nDone = [...ck.steps].filter((i) => i < nSteps).length;

          <button class="icon-btn glass" id="planTop" aria-label="Ajouter au planning">${ICON.cal}</button>

          <div class="lbl"><b>${plural(cur, "personne", "personnes")}</b><small>${factor !== 1 ? `Quantités recalculées · recette pour ${base}` : "Les quantités s'adaptent automatiquement"}</small></div>
          <div class="stepper"><button id="minus" aria-label="Une personne de moins" ${cur <= 1 ? "disabled" : ""}>${ICON.minus}</button><output aria-live="polite" class="sr-only">${plural(cur, "personne", "personnes")}</output><output aria-hidden="true">${cur}</output><button id="plus" aria-label="Une personne de plus">${ICON.plus}</button></div>
        </div>` : ""}

        <div class="cols">
          <section aria-labelledby="h-ing">

            <ul class="ingredients">${(r.ingredients || []).map((l, i) => `<li><label class="ing"><span class="check"><input type="checkbox" data-ing="${i}" ${ck.ing.has(i) ? "checked" : ""}><span>${ICON.check}</span></span><span class="txt">${scaleLine(l, factor)}</span></label></li>`).join("") || '<li class="muted">Aucun ingrédient pour l\'instant.</li>'}</ul>
          </section>
          <section aria-labelledby="h-steps">
            <div class="section-h"><h3 id="h-steps">Étapes</h3>${nSteps ? `<small>${nDone} / ${nSteps}</small>` : ""}</div>
            ${nSteps ? `<div class="progress" aria-hidden="true"><i style="width:${(nDone / nSteps) * 100}%"></i></div>` : ""}
            <ol class="steps">${(r.etapes || []).map((e, i) => `<li><button class="step" data-step="${i}" aria-pressed="${ck.steps.has(i)}"><span class="n">${ck.steps.has(i) ? ICON.check : i + 1}</span><span>${esc(e)}</span></button></li>`).join("") || '<li class="muted">Aucune étape pour l\'instant.</li>'}</ol>
          </section>
        </div>
        ${r.notes ? `<section><div class="section-h"><h3>Notes</h3></div><div class="notes">${esc(r.notes)}</div></section>` : ""}
        ${(r.tags || []).length ? `<section><div class="section-h"><h3>Mots-clés</h3></div><div class="tags">${r.tags.map((t) => `<span class="pill line">#${esc(t)}</span>`).join("")}</div></section>` : ""}
        ${r.source ? `<a class="source" href="${esc(r.source)}" target="_blank" rel="noopener"><span class="ico">${ICON.camera}</span><span class="src-txt"><b>Voir la publication d'origine</b><small>${esc(sourceName(r.source))} · ${esc(r.source.replace(/^https?:\/\/(www\.)?/, ""))}</small></span>${ICON.chevron}</a>` : ""}
      </div></article>
      <div class="actionbar wrap"><div class="actionbar-inner">
        <button class="btn btn-primary" id="planBtn">${ICON.cal}Ajouter au planning</button>
        <button class="btn btn-secondary" id="editBtn">${ICON.edit}Modifier</button>
      </div></div>`;
    $("#backBtn").onclick = () => {
      state.selected = null;
      if (state.from === "semaine") { state.view = "semaine"; state.from = null; }
      render();
    };
    $("#editBtn").onclick = $("#editTop").onclick = () => openEditor(r);
    $("#planBtn").onclick = $("#planTop").onclick = () => openAddToPlan(r, cur || 2);
    $("#favBtn").onclick = () => { r.favori = !r.favori; save(); render(); toast(r.favori ? "Ajoutée aux favoris" : "Retirée des favoris"); };
    const fc = $("#fillClip");
    if (fc) {
      fc.onclick = async () => {
        let t = "";
        try { t = await navigator.clipboard.readText(); } catch {}

      const top = pane.scrollTop; renderDetail(); pane.scrollTop = top;
    });
  }

  // Complète une recette importée dont la légende n'avait pas pu être lue.
  function fillFromText(r, text, p = parseRecipe(text, r.source)) {
    if (!p.ingredients.length && !p.etapes.length) { toast("Aucune recette trouvée dans ce texte"); return false; }
    const generic = !r.titre || /^Recette (Instagram|Facebook|TikTok|lien)/.test(r.titre);
    Object.assign(r, { ingredients: p.ingredients, etapes: p.etapes, notes: p.notes || r.notes, tags: p.tags.length ? p.tags : r.tags,
      portions: p.portions || r.portions, prep: p.prep || r.prep, cuisson: p.cuisson || r.cuisson,
      categorie: r.categorie || p.categorie, titre: generic && p.titre ? p.titre : r.titre });
    state.portions = null; save(); render(); toast("Recette complétée, vérifie-la");
    return true;
  }
  function openRecipe(id, from) {
    state.view = "recettes"; state.selected = id; state.portions = null; state.from = from || null;
    render(); $("#detailPane").scrollTop = 0;
  }

  function render() {
    document.body.classList.remove("v-recettes", "v-semaine", "v-courses");

    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.view === state.view));
    if (state.view === "recettes") { renderChips(); renderList(); renderDetail(); }
    else if (state.view === "semaine") renderPlan();
    else renderShop();
    updateShopDot();
  }
  document.querySelector(".tabbar").addEventListener("click", (e) => {
    const t = e.target.closest(".tab"); if (!t) return;
    if (t.dataset.view === state.view && state.view === "recettes" && state.selected && !wide()) { state.selected = null; }
    state.view = t.dataset.view; state.from = null; render();
  });
  const wide = () => window.matchMedia("(min-width: 820px)").matches;

  // ---------- Semaines ----------
  const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  const fromIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
  const dShort = (d) => d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  const thisWeek = () => iso(mondayOf(new Date()));
  function weekLabel(w) {
    const a = fromIso(w), b = fromIso(addDays(w, 6));
    const cur = thisWeek();
    const rel = w === cur ? "Cette semaine" : w === addDays(cur, 7) ? "Semaine prochaine" : w === addDays(cur, -7) ? "Semaine dernière" : "";
    const month = (d) => d.toLocaleDateString("fr-FR", { month: "long" });
    const range = a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${month(b)}` : `${a.getDate()} ${month(a)} – ${b.getDate()} ${month(b)}`;
    return { rel, range };
  }
  function weekBarHtml() {
    const { rel, range } = weekLabel(state.week);
    return `<div class="weekbar">
      <button class="icon-btn" data-wk="-7" aria-label="Semaine précédente">${ICON.back}</button>
      <div class="range"><b>${range}</b><small>${rel || "&nbsp;"}</small></div>
      ${state.week !== thisWeek() ? `<button class="btn btn-soft" data-wk="0" style="min-height:36px;padding:0 14px">Aujourd'hui</button>` : ""}
      <button class="icon-btn" data-wk="7" aria-label="Semaine suivante">${ICON.next}</button></div>`;
  }
  function bindWeekNav(root) {
    root.querySelectorAll("[data-wk]").forEach((b) => b.onclick = () => {
      state.week = +b.dataset.wk === 0 ? thisWeek() : addDays(state.week, +b.dataset.wk); render();
      root.scrollTop = 0;
    });
  }
  const entries = (w) => plan[w] || (plan[w] = []);
  const recipeOf = (id) => recipes.find((r) => r.id === id);

  // ---------- Planning ----------
  function renderPlan() {
    const w = state.week, list = entries(w), today = iso(new Date());
    const known = list.filter((e) => recipeOf(e.recette));

  // ---------- Liste de courses ----------
  // Chaque unité appartient à une famille : seules les quantités d'une même famille s'additionnent
  // (les grammes avec les kilos, les cl avec les litres ; jamais 200 g avec 20 cl).
  const UNITS = [
    [/^(kg|kilos?|kilogrammes?)$/, "g", 1000], [/^(g|gr|grammes?)$/, "g", 1], [/^mg$/, "g", .001],
    [/^(l|litres?)$/, "ml", 1000], [/^(dl)$/, "ml", 100], [/^(cl)$/, "ml", 10], [/^(ml)$/, "ml", 1],
    [/^(c\. ?a soupe|c\. ?a s\.?|cas|cuilleres? a soupe|cs)$/, "c. à soupe", 1],
    [/^(c\. ?a cafe|c\. ?a c\.?|cac|cuilleres? a cafe|cc)$/, "c. à café", 1],
    [/^(pincees?)$/, "pincée", 1], [/^(sachets?)$/, "sachet", 1], [/^(gousses?)$/, "gousse", 1], [/^(tranches?)$/, "tranche", 1],
    [/^(bouquets?)$/, "bouquet", 1], [/^(boites?|boîtes?)$/, "boîte", 1], [/^(brins?)$/, "brin", 1], [/^(feuilles?)$/, "feuille", 1],
    [/^(verres?)$/, "verre", 1], [/^(tasses?)$/, "tasse", 1], [/^(pots?)$/, "pot", 1], [/^(paquets?)$/, "paquet", 1],
    [/^(paves?|pavés?)$/, "pavé", 1],
  ];
  function parseIngredient(line) {
    const p = parseQty(line);
    let rest = p ? line.slice(p.len).trim() : line.trim(), unit = "", mult = 1;
    if (p) {
      const n = norm(rest);
      for (const [re, u, m] of UNITS) {
        const src = re.source.slice(1, -1);
        const mm = n.match(new RegExp("^(" + src + ")(?=\\s|$|\\b)"));
        if (mm) { unit = u; mult = m; rest = rest.slice(mm[0].length).trim(); break; }
      }
    }
    rest = rest.replace(/^(de |d'|d’|des |du )/i, "").replace(/\s*\(.*?\)\s*/g, " ").trim();
    const key = norm(rest).replace(/s\b/g, "").replace(/[^a-z0-9 ]/g, "").trim();
    return { qty: p ? p.v * mult : null, unit, name: rest || line.trim(), key: (p ? unit || "u" : "-") + "|" + key };
  }
  function fmtAmount(q, unit) {
    if (q == null) return "";
    if (unit === "ml" && q > 50) q = Math.round(q / 10) * 10;
    if (unit === "g" && q > 20) q = Math.round(q / 5) * 5;
    if (!unit) q = Math.ceil(q - 0.05);   // on n'achète pas ⅓ d'œuf
    if (unit === "g" && q >= 1000) return fmtQty(q / 1000) + " kg";
    if (unit === "ml" && q >= 1000) return fmtQty(q / 1000) + " L";
    if (unit === "ml" && q >= 10 && q % 10 === 0) return fmtQty(q / 10) + " cl";
    if (unit === "g" || unit === "ml") return Math.round(q) + " " + unit;
    return fmtQty(Math.round(q * 4) / 4 || q) + (unit ? " " + unit + (q > 1 && !unit.startsWith("c.") ? "s" : "") : "");
  }
  function shopItems(w) {
    const map = new Map();
    entries(w).forEach((e) => {
      const r = recipeOf(e.recette); if (!r) return;
      const f = Number(r.portions) ? e.personnes / Number(r.portions) : 1;
      (r.ingredients || []).forEach((line) => {
        const it = parseIngredient(line);
        const cur = map.get(it.key) || { key: it.key, name: it.name, unit: it.unit, qty: it.qty == null ? null : 0, from: new Set() };
        if (it.qty != null && cur.qty != null) cur.qty += it.qty * f;
        cur.from.add(r.titre);
        map.set(it.key, cur);
      });
    });
    return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, "fr"));
  }
  const shopOf = (w) => shop[w] || (shop[w] = { coches: {}, extras: [] });

    v.scrollTop = top;

    const rs = $("#restore"); if (rs) rs.onclick = () => { delete s.retires; save("courses"); renderShop(); };
    const c = $("#copyShop"); if (c) c.onclick = async () => {
      const txt = `Courses (${weekLabel(w).range})\n` + todo.map((x) => "- " + (x.amount ? x.amount + " " : "") + x.label).join("\n");

  // Demande à la fonction Supabase « lire-publication » le texte et la photo d'une publication.
  async function lirePublication(url) {

    if (!base) throw new Error("config");
    const r = await fetch(base + "/functions/v1/lire-publication", {
      method: "POST", headers: { "Content-Type": "application/json", apikey: key }, body: JSON.stringify({ url, categories: categories().map(([c]) => c) }),

  function sourceName(url) {
    try {
      const h = new URL(url).hostname.replace(/^www\.|^m\./, "");
      return ({ "instagram.com": "Instagram", "facebook.com": "Facebook", "fb.watch": "Facebook", "tiktok.com": "TikTok", "youtube.com": "YouTube", "youtu.be": "YouTube", "pinterest.com": "Pinterest", "pin.it": "Pinterest" })[h] || h;
    } catch { return "lien"; }
  }
  // Lit une légende de réseau social et en sort titre, ingrédients, étapes, mots-clés.
  function parseRecipe(text, url) {
    const ta = document.createElement("textarea"); ta.innerHTML = String(text || ""); text = ta.value.replace(/\r/g, "").replace(/[\u2028\u2029]/g, "\n");
    // Légende lue par le raccourci : « 1 234 likes, 56 comments - compte on 3 octobre 2026: "…" »
    text = text.replace(/^[^\n"]*?(likes?|J’aime|J'aime|mentions? J’aime)[^\n"]*?:\s*"([\s\S]*?)"?\.?\s*$/i, "$2");
    if (!url) { const m = text.match(/https?:\/\/\S+/); if (m) url = m[0]; }
    text = text.replace(/https?:\/\/\S+/g, "");
    const tags = [...new Set((text.match(/#[\p{L}\p{N}_]+/gu) || []).map((t) => t.slice(1).toLowerCase()))].slice(0, 8);
    const clean = (l) => l.replace(/#[\p{L}\p{N}_]+/gu, "")
      .replace(/^[\s\p{Extended_Pictographic}️‍•·▪▫◦●○■□►▶➡→✓✔☑✅\-–—*+]+/u, "")
      .replace(/[\p{Extended_Pictographic}️‍]+/gu, " ").replace(/\s{2,}/g, " ").trim();
    const raw = text.split("\n");
    const head = (l) => {
      const c = norm(clean(l)).replace(/[:：\s]+$/, "");
      if (/^(les )?ingredients?( pour .*)?$|^il (vous )?faut$|^pour \d+ (personnes|parts)/.test(c)) return "ing";
      if (/^(la )?(preparation|recette|etapes?|instructions?|deroule|methode|realisation)$/.test(c)) return "step";
      return null;
    };
    let titre = "", mode = null, ingredients = [], etapes = [], notes = [], portions = 0, prep = 0, cuisson = 0;
    raw.forEach((l) => {
      const c = clean(l); if (!c) return;
      const n = norm(c);
      const pm = n.match(/pour (\d+) (personnes?|parts?|pers)/) || n.match(/(\d+) (personnes|portions|parts)/) || n.match(/^pour (\d+)\b/); if (pm && !portions) portions = +pm[1];
      if (/^pour \d+\b/.test(n) && c.length < 40) return;
      const pr = n.match(/prep\w*\s*:?\s*(\d+)\s*(min|h)/); if (pr && !prep) prep = +pr[1] * (pr[2] === "h" ? 60 : 1);
      const cu = n.match(/cuisson\s*:?\s*(\d+)\s*(min|h)/); if (cu && !cuisson) cuisson = +cu[1] * (cu[2] === "h" ? 60 : 1);
      const h = head(l);
      if (h) {
        mode = h;
        const after = c.split(/[:：]/).slice(1).join(":").trim();
        if (after) (h === "ing" ? ingredients : etapes).push(after);
        return;
      }
      // Les formules d'accroche (« Hello tout le monde », « Nouvelle recette ! ») ne font pas un bon titre.
      const accroche = /^(hello|hey|coucou|bonjour|bonsoir|salut|hi|yo)\b|^(nouvelle |petite )?recette( du jour| facile| rapide)?\s*[!:.]*$|^(abonne|abonnez|enregistre|enregistrez|partage|lien en bio|tag)/.test(n);
      if (!titre && accroche) { notes.push(c); return; }
      if (!titre && c.length <= 80 && !parseQty(c)) { titre = c.replace(/[:!.]+$/, ""); return; }
      if (pr || cu) return;
      const step = c.replace(/^(\d+\s*[.)\-:]|[①-⑳]|etape \d+\s*:?)\s*/i, "");
      if (mode === "ing") ingredients.push(c);
      else if (mode === "step") etapes.push(step);
      else if (parseQty(c) && c.length < 70) ingredients.push(c);
      else if (/^\d+\s*[.)]/.test(c) || /^etape/i.test(n)) etapes.push(step);
      else notes.push(c);
    });
    // Sans titres de section : les longues phrases deviennent des étapes.
    if (!etapes.length && notes.length) { etapes = notes.filter((x) => x.length > 25); notes = notes.filter((x) => x.length <= 25); }
    return {
      titre: titre || (url ? "Recette " + sourceName(url) : ""), categorie: guessCategory(norm(text), norm(titre)), source: url || "",
      prep, cuisson, portions: portions || 4, ingredients, etapes, notes: notes.join("\n"), tags,
    };
  }
  // Devine la catégorie : les mots du titre comptent triple, le reste du texte départage.
  function guessCategory(n, t = "") {
    const cats = categories().map(([c]) => c);
    const rules = [[/gateau|cake|tarte (au|aux|a la) (citron|pomme|fraise|chocolat|poire)|tartelette|cookie|brownie|mousse au|creme (brulee|dessert|anglaise)|dessert|chocolat|crepe|tiramisu|cheesecake|muffin|clafoutis|fondant|biscuit|meringue/g, "Desserts"],
      [/soupe|veloute|potage|bouillon de|minestrone|gaspacho/g, "Soupes"], [/sauce|pesto|vinaigrette|mayonnaise|aioli|chimichurri/g, "Sauces"],
      [/pancake|granola|porridge|brunch|petit.dej|overnight|bowl cake|tartine/g, "Petit-déjeuner"], [/salade|entree|tartinade|houmous|verrine|tapenade|bruschetta|aperitif/g, "Entrées"],
      [/cocktail|smoothie|boisson|limonade|mocktail/g, "Boissons"],
      [/poulet|boeuf|porc|agneau|veau|poisson|saumon|cabillaud|crevette|pates|spaghetti|lasagne|curry|gratin|risotto|quiche|burger|pizza|pomme de terre|pommes de terre|riz|plat|wok|tajine|parmentier|steak|lentilles|pois chiches/g, "Plats"]];
    let best = null, top = 0;
    rules.forEach(([re, cat]) => {
      const score = 3 * (t.match(re) || []).length + (n.match(re) || []).length;
      if (score > top) { top = score; best = cat; }
    });
    return best ? (cats.find((c) => norm(c) === norm(best)) || best) : "";
  }

  // ---------- Apparence : automatique, clair ou sombre ----------
  const THEME_KEY = "yumi-theme";
  function getTheme() { try { return localStorage.getItem(THEME_KEY) || "auto"; } catch { return "auto"; } }
  function applyTheme(t) {
    const root = document.documentElement;
    if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
    const dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
      if (t === "auto") { m.content = m.media && m.media.includes("dark") ? "#0D171B" : "#F7FAF8"; }
      else m.content = dark ? "#0D171B" : "#F7FAF8";
    });
  }
  function setTheme(t) { try { localStorage.setItem(THEME_KEY, t); } catch {} applyTheme(t); }

          <button class="btn btn-secondary" id="copyBtn">${ICON.copy}Copier les recettes (texte)</button>
          <button class="btn btn-secondary" id="importBtn">Importer un fichier de recettes</button>
          ${nEx ? `<button class="btn btn-danger" id="rmEx">${ICON.trash}Retirer les ${nEx} recettes d'exemple</button>` : ""}
        </div>
        <div class="about">${LOGO}<span>Ton carnet de recettes, sur iPhone et iPad.</span></div>
      </div>`);
    $("#closeMenu").onclick = closeSheet;
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.onclick = () => {
      setTheme(b.dataset.themeSet);
      document.querySelectorAll("[data-theme-set]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    });
    bindSync();
    refreshMenu = () => { const b = $("#syncBox"); if (b && (!$("#loginForm") || sync.connected())) { b.innerHTML = syncSectionHtml(); bindSync(); } };
    $("#exportBtn").onclick = exportJson;
    $("#copyBtn").onclick = async () => {
      try { await navigator.clipboard.writeText(JSON.stringify(exportData(), null, 2)); toast("Recettes copiées"); }
      catch { toast("Copie impossible ici, utilise l'export"); }
    };
    $("#importBtn").onclick = () => $("#importFile").click();
    if (nEx) $("#rmEx").onclick = () => {
      recipes = recipes.filter((r) => !r.exemple);
      if (!recipes.some((r) => r.id === state.selected)) state.selected = null;
      save(); closeSheet(); render(); toast("Exemples retirés");
    };
  }
  const exportData = () => ({ app: "mes-recettes", version: 2, exporteLe: new Date().toISOString(), recettes: recipes, planning: plan, courses: shop });
  async function exportJson() {
    const name = `yumi-${new Date().toISOString().slice(0, 10)}.json`;
    const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type: "application/json" });
    try {
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Yumi" }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $("#importFile").addEventListener("change", async (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data.recettes;
      if (!Array.isArray(list)) throw new Error();
      let added = 0, updated = 0;
      list.forEach((r) => {
        if (!r || !r.titre) return;
        const i = recipes.findIndex((x) => x.id === r.id);
        if (i >= 0) { recipes[i] = r; updated++; } else { recipes.push({ ...r, id: r.id || uid() }); added++; }
      });
      if (data.planning && typeof data.planning === "object") { plan = { ...plan, ...data.planning }; save("planning"); }
      if (data.courses && typeof data.courses === "object") { shop = { ...shop, ...data.courses }; save("courses"); }
      save(); closeSheet(); render(); toast(`${added} ajoutée${added > 1 ? "s" : ""}, ${updated} mise${updated > 1 ? "s" : ""} à jour`);
    } catch { toast("Ce fichier n'est pas un export de recettes"); }
  });

  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2400); }

  // ---------- Événements ----------
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; $("#qClear").hidden = !state.q; renderList(); });
  $("#qClear").addEventListener("click", () => { state.q = ""; $("#q").value = ""; $("#qClear").hidden = true; renderList(); $("#q").focus(); });
  $("#chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; state.cat = b.dataset.cat; renderChips(); renderList(); });
  $("#favFilter").addEventListener("click", () => { state.fav = !state.fav; renderChips(); renderList(); });
  $("#timeSel").addEventListener("change", (e) => { state.maxTime = +e.target.value; renderChips(); renderList(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; renderList(); });
  $("#cards").addEventListener("click", (e) => {
    const a = e.target.closest("[data-act]");
    if (a) {
      if (a.dataset.act === "add") openAddChoice();
      else { state.q = ""; $("#q").value = ""; state.cat = ""; state.fav = false; state.maxTime = 0; renderChips(); renderList(); }
      return;
    }
    const b = e.target.closest(".card"); if (!b) return;
    openRecipe(b.dataset.id);
  });
  $("#addBtn").addEventListener("click", openAddChoice);
  $("#menuBtn").addEventListener("click", openMenu);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => applyTheme(getTheme()));

  // ---------- Démarrage ----------
  state.week = thisWeek();
  (async () => {
    const stored = await load();
    recipes = Array.isArray(stored) ? stored : makeSamples();
    plan = (await load("planning")) || {};
    shop = (await load("courses")) || {};
    meta = { recettes: {}, planning: {}, courses: {}, supprimees: {}, ...((await load("meta")) || {}) };
    if (!Array.isArray(stored)) {
      // Exemple de planning pour la semaine en cours
      [[0, "soir", "ex-3", 2], [1, "midi", "ex-1", 2], [2, "soir", "ex-2", 4], [3, "midi", "ex-4", 2], [4, "soir", "ex-9", 4], [5, "midi", "ex-7", 4], [6, "midi", "ex-5", 4]]
        .forEach(([j, m, r, p]) => entries(state.week).push({ id: uid(), jour: j, repas: m, recette: r, personnes: p }));
      // Les exemples sont datés « très ancien » : toute vraie donnée synchronisée passe devant.
      recipes.forEach((r) => (meta.recettes[r.id] = 1));
      meta.planning[state.week] = 1;
      persistAll();
    }
    snapshot();
    await sync.init();
    if (wide() && recipes.length) state.selected = filtered()[0].id;
    render();
    const params = new URLSearchParams(location.search);
    if (params.has("texte") || params.has("url")) {
      history.replaceState(null, "", location.pathname);
      openEditor(null, { ...parseRecipe(params.get("texte") || "", params.get("url") || ""), photo: params.get("image") || "" });
    }
    sync.run();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync.run(); });
    window.addEventListener("online", () => sync.run());
  })();
  render();

  if ("serviceWorker" in navigator && location.protocol === "https:" && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>

</body>
</html>
